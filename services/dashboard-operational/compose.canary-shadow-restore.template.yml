# Deploy only after the new image has seeded a separate, pack-only volume.
# This service never mounts the live source volume or starts the app server.
services:
  shadow_restore:
    image: REPLACE_WITH_UPDATED_MAINTENANCE_IMAGE_AT_SHA256
    user: "1000:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["restore-shadow", "drill-20260930-01", "REPLACE_WITH_NEW_IMAGE_PIN_PACK_SHA256"]
    volumes:
      - type: volume
        source: snapshot_output
        target: /backup-data
        read_only: true
      - type: volume
        source: shadow_identity
        target: /restore-data
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
volumes:
  snapshot_output:
    external: true
    name: dashboard-canary-snapshot-drill-20260930-01
  shadow_identity:
    external: true
    name: dashboard-canary-shadow-update-drill-20260930-01

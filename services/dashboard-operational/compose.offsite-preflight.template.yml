# Deploy this hold service ALONE. It inspects metadata only; no backup starts.
# Continue only if health is green AND MCP Mounts confirms source RW=false,
# source identity expected, target identity new/distinct and resource limits.
services:
  identity-source-preflight-hold:
    image: ${SNAPSHOT_IMAGE_REF:?pin reviewed snapshot image digest}
    command: ["hold"]
    user: "1000:1000"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    pids_limit: 16
    mem_limit: 128m
    cpus: 0.1
    healthcheck:
      test: ["CMD", "node", "/app/jobguard.cjs", "check"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 1
    volumes:
      - type: volume
        source: corporate_identity_source
        target: /source-data
        read_only: true
      - type: volume
        source: new_snapshot
        target: /snapshot-data
volumes:
  corporate_identity_source:
    external: true
    name: ${CORP_IDENTITY_VOLUME:?private source volume name required}
  new_snapshot:
    name: ${NEW_SNAPSHOT_VOLUME:?unique new snapshot volume name required}

# Proposal only. Root owns CI/repository integration; no publisher or secret.
native-postgres17-writer-component-proof:
  runs-on: ubuntu-latest
  timeout-minutes: 8
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install locked native fixture client
      run: npm ci --prefix services/crm-manager-provisioner --ignore-scripts --no-audit --no-fund
    - name: Prove inactive writer scope, native rowlocks and empty rollback
      env:
        CRM_MANAGER_WRITER_NATIVE_PROOF: '1'
        NODE_PATH: ${{ github.workspace }}/services/crm-manager-provisioner/node_modules
      run: bash tools/crm-manager-writer-review/native/run-native-writer-proof.sh

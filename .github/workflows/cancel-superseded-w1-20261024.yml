name: Cancel superseded W1 CI once
'on':
  push:
    branches: [codex/cancel-w1-ci-20261024]
permissions:
  contents: read
  actions: write
jobs:
  cancel-exact-uninstalled-run:
    if: github.repository == 'bandssz/shrigma-dash-cx' && github.event_name == 'push' && github.ref == 'refs/heads/codex/cancel-w1-ci-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded W1 before any maintenance window
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const a=require('node:assert/strict'),repo='bandssz/shrigma-dash-cx',run=40059674913,sha='b06abaf1533cdbcc513c62cd56ae97d3141c0bd8';
          (async()=>{
            a.equal(process.env.GITHUB_REPOSITORY,repo);a.equal(process.env.GITHUB_REF,'refs/heads/codex/cancel-w1-ci-20261024');a.equal(process.env.GITHUB_EVENT_NAME,'push');
            const request=async(path,method='GET')=>{const r=await fetch('https://api.github.com/repos/'+repo+path,{method,redirect:'error',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(15000)});if(method==='POST'){a.equal(r.status,202);return null;}a.equal(r.status,200);return r.json();};
            const state=await request('/actions/runs/'+run);a.equal(state.id,run);a.equal(state.head_sha,sha);a.equal(state.head_branch,'main');a.equal(state.event,'push');a.equal(state.name,'Shrigma native CRM connection');a.equal(state.head_repository.full_name,repo);
            if(state.status==='completed'){console.log(JSON.stringify({ok:true,action:'already-complete-no-mutation',run,conclusion:state.conclusion}));return;}a.equal(state.status,'in_progress');
            a.equal((await request('/git/ref/heads/main')).object.sha,sha);
            const jobs=await request('/actions/runs/'+run+'/jobs'),job=jobs.jobs.find(x=>x.id===120770241157);a(job);a.equal(job.name,'verify-affiliate-read');a.equal(job.steps.find(x=>x.status==='in_progress')?.number,27);a.equal(job.steps.find(x=>x.number===28)?.status,'pending');
            const file=await request('/contents/ops/maintenance-install-window.json?ref=codex%2Fmaintenance-window');a.equal(file.encoding,'base64');a(file.size>0&&file.size<=8192);const notice=JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));a.equal(notice.schema,'shrigma-programmed-maintenance-v1');a.notEqual(notice.targetRevision,sha);a(Number.isFinite(Date.parse(notice.expiresAt))&&Date.parse(notice.expiresAt)<Date.now());
            await request('/actions/runs/'+run+'/cancel','POST');console.log(JSON.stringify({ok:true,action:'cancel-requested',run,sha,noValidMaintenanceNotice:true,deploys:0}));
          })().catch(()=>{console.error(JSON.stringify({ok:false,code:'EXACT_UNINSTALLED_RUN_CANCEL_REFUSED',noFallback:true}));process.exitCode=1;});
          NODE

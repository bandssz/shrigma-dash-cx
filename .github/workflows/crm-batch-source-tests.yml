name: CRM batch isolated functional proof (OFF)
on:
  pull_request:
    paths:
      - 'crm-scheduler-batch-profile.json'
      - 'tools/listmonk-regular-build/**'
      - 'tools/listmonk-regular-package/**'
      - 'tests/segment-regular-native-fixture.cjs'
      - 'tests/source-proof-split/**'
      - 'tests/native-profile-v4.test.cjs'
      - 'tests/rule-membership/**'
      - 'n8n/growth/segment-listmonk-selection*'
      - '.github/workflows/crm-batch-source-tests.yml'
permissions:
  contents: read
jobs:
  source-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.1'
          cache: false
      - name: Prepare pinned disposable dependencies
        shell: bash
        run: |
          set -euo pipefail
          batch_root="$(mktemp -d /tmp/shrigma-batch-ci.XXXXXXXX)"
          export BATCH_FIXTURE_ROOT="$batch_root"
          printf 'BATCH_FIXTURE_ROOT=%s\n' "$batch_root" >> "$GITHUB_ENV"
          npm install --prefix "$BATCH_FIXTURE_ROOT/batch-tools" --no-save --ignore-scripts --no-audit --no-fund pg@8.23.1 @electric-sql/pglite@0.3.14 @embedded-postgres/linux-x64@17.10.0-beta.17
          (cd "$BATCH_FIXTURE_ROOT/batch-tools/node_modules/@embedded-postgres/linux-x64" && node scripts/hydrate-symlinks.js)
          python3 tools/listmonk-regular-package/bootstrap.py --out "$BATCH_FIXTURE_ROOT/batch-inputs" --go "$(command -v go)"
      - name: Verify new functional split gates without native execution
        env:
          SOURCE_SPLIT_TEST_ROOT: ${{ github.workspace }}
        run: |
          node --test tests/source-proof-split/profile.test.cjs
          python3 tests/source-proof-split/receipts.test.py
          node tests/native-profile-v4.test.cjs "$GITHUB_WORKSPACE"
      - name: Compile exact candidate, foundation and isolated functional proof as UID1000
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.3
          id -u 1000
          TASK_OUTPUT="$BATCH_FIXTURE_ROOT/batch-source-output"
          mkdir "$TASK_OUTPUT" "$BATCH_FIXTURE_ROOT/source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive HEAD | tar -xf - -C "$BATCH_FIXTURE_ROOT/source"
          sudo chown -R 1000 "$BATCH_FIXTURE_ROOT"
          sudo chmod 755 "$BATCH_FIXTURE_ROOT"
          cd "$BATCH_FIXTURE_ROOT/source"
          PROFILE_DIGEST="$(sha256sum crm-scheduler-batch-profile.json | cut -d ' ' -f1)"
          sudo -u '#1000' env \
            PATH="$PATH" GOTOOLCHAIN=local PYTHONDONTWRITEBYTECODE=1 \
            REGULAR_NATIVE_PROOF_ISOLATED=1 \
            PROFILE_INPUT="$BATCH_FIXTURE_ROOT/source/crm-scheduler-batch-profile.json" \
            PROFILE_DIGEST="$PROFILE_DIGEST" \
            TASK_OUTPUT="$TASK_OUTPUT" \
            NODE_PATH="$BATCH_FIXTURE_ROOT/batch-tools/node_modules" \
            GO_BINARY="$(command -v go)" \
            PG_BINARY_DIR="$BATCH_FIXTURE_ROOT/batch-tools/node_modules/@embedded-postgres/linux-x64/native/bin" \
            REVIEWED_INPUTS="$BATCH_FIXTURE_ROOT/batch-inputs" \
            bash tools/listmonk-regular-build/proof-source-only.sh
          # Only the closed public report and reviewed public graph leave UID1000 custody.
          sudo -u '#1000' env TASK_OUTPUT="$TASK_OUTPUT" python3 - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['TASK_OUTPUT'])
          candidates=list((root/'runtime').glob('regular-native-*/rule-membership-native.json'))
          assert len(candidates)==1
          source=candidates[0]
          content=source.read_bytes()
          report=json.loads(content)
          assert report['ok'] is True and len(report['cases'])==28
          assert report['rollbackConfirmed'] is True and report['endConfirmed'] is True
          assert report['originalCalls']==0 and report['persistentDatabase'] is False
          assert report['afterKernelSha256']=='7d9e4cd7fd4e3c6f9967386c5ca7b1410e755690fac3a77149d8d032d2c4e8b4'
          evidence=root/'evidence'
          evidence.mkdir(mode=0o755)
          target=evidence/'rule-membership-native.json'
          target.write_bytes(content)
          target.chmod(0o644)
          assert hashlib.sha256(target.read_bytes()).digest()==hashlib.sha256(content).digest()
          (root/'profile-with-binary').chmod(0o755)
          PYCODE
      - name: Package the exact tested batch binary as an isolated OCI candidate
        id: oci
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          oci_root="$(mktemp -d /tmp/shrigma-batch-oci.XXXXXXXX)"
          printf 'BATCH_OCI_ROOT=%s\n' "$oci_root" >> "$GITHUB_ENV"
          cd "$BATCH_FIXTURE_ROOT/source"
          profile="$BATCH_FIXTURE_ROOT/batch-source-output/profile-with-binary/PROFILE.json"
          profile_digest="$(sha256sum "$profile" | cut -d ' ' -f1)"
          REGULAR_NATIVE_PROOF_ISOLATED=1 python3 tools/listmonk-regular-package/image.py \
            --package "$BATCH_FIXTURE_ROOT/batch-source-output/package" \
            --native-proof "$BATCH_FIXTURE_ROOT/batch-source-output/native-functional-proof.json" \
            --batch-profile "$profile" --batch-profile-sha256 "$profile_digest" \
            --isolated-source-proof --revision "$GITHUB_SHA" --out "$oci_root/image"
      - name: Upload the verified batch OCI candidate without registry push or deployment
        if: ${{ success() && steps.oci.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-batch-worker-oci-linux-amd64
          path: ${{ env.BATCH_OCI_ROOT }}/image/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload synthetic proof without original delivery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-batch-source-foundation
          path: |
            ${{ env.BATCH_FIXTURE_ROOT }}/batch-source-output/profile-receipt.json
            ${{ env.BATCH_FIXTURE_ROOT }}/batch-source-output/package/manifest.json
            ${{ env.BATCH_FIXTURE_ROOT }}/batch-source-output/dependency-proof.json
            ${{ env.BATCH_FIXTURE_ROOT }}/batch-source-output/native-functional-proof.json
            ${{ env.BATCH_FIXTURE_ROOT }}/batch-source-output/evidence/rule-membership-native.json
            ${{ env.BATCH_FIXTURE_ROOT }}/batch-source-output/profile-with-binary/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

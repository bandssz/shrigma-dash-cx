name: Dashboard regression
on:
  pull_request:
    paths:
      - 'growth*'
      - 'organico*'
      - 'influs*'
      - 'campaign-contract.js'
      - '_config.yml'
      - 'cx*'
      - 'index.html'
      - 'app.js'
      - 'dados.js'
      - 'config.js'
      - 'alerta-*.js'
      - 'n8n/**'
      - 'frescor.js'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/growth-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --prefix ../growth-test-tools --no-save --ignore-scripts --no-audit --no-fund linkedom@0.18.12 @electric-sql/pglite@0.3.14
      - name: Run synthetic regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.cjs | tee "$RUNNER_TEMP/growth-tests.txt"
      - name: Check campaign SQL on isolated PostgreSQL
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/campaign-provider-postgres.cjs
      - name: Check organic attribution on isolated PostgreSQL
        env:
          ORGANICO_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/organico-attribution-postgres.cjs
      - name: Check TikTok reconciliation on isolated PostgreSQL
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/tts-canal-reconciliation-postgres.cjs
      - name: Save test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-test-results
          path: ${{ runner.temp }}/growth-tests.txt
          retention-days: 7

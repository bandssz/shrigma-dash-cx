name: Dashboard regression
on:
  pull_request:
    paths:
      - 'growth*'
      - 'organico*'
      - 'influs*'
      - 'campaign-contract.js'
      - 'whatsapp-template-contract.js'
      - '_config.yml'
      - 'cx*'
      - 'index.html'
      - 'app.js'
      - 'dados.js'
      - 'config.js'
      - 'alerta-*.js'
      - 'n8n/**'
      - 'tools/campaign-runtime-build/**'
      - 'tools/panel-build/**'
      - 'cx/**'
      - 'crm/**'
      - 'organico/**'
      - 'creators/**'
      - 'gestao/**'
      - 'assets/panels/**'
      - '*.js'
      - 'frescor.js'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/growth-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --prefix ../growth-test-tools --no-save --ignore-scripts --no-audit --no-fund linkedom@0.18.12 @electric-sql/pglite@0.3.14
      - name: Run synthetic regression tests
        shell: bash
        env:
          NODE_PATH: ../growth-test-tools/node_modules
        run: |
          set -o pipefail
          node --test tests/*.test.cjs | tee "$RUNNER_TEMP/growth-tests.txt"
      - name: Check pinned campaign runtime bundle
        run: |
          npm ci --prefix tools/campaign-runtime-build --ignore-scripts --no-audit --no-fund
          node tools/campaign-runtime-build/build.cjs --check
          node tools/panel-build/build.cjs --check
      - name: Check campaign SQL on isolated PostgreSQL
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/campaign-provider-postgres.cjs
      - name: Check incremental campaign cancellation
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: |
          node tests/campaign-cancel-postgres.cjs
          node tests/campaign-atomic-receipt-postgres.cjs
      - name: Check out-of-order purchase guard
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/cart-order-monotonic-postgres.cjs
      - name: Check area access isolation and hashed credentials
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: |
          node tests/panel-auth-postgres.cjs
          node tests/panel-short-keys-postgres.cjs
          node tests/panel-operator-postgres.cjs
          node tests/creators-pilot-postgres.cjs
      - name: Check organic attribution on isolated PostgreSQL
        env:
          ORGANICO_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/organico-attribution-postgres.cjs
      - name: Check Meta webhook comment ingestion on isolated PostgreSQL
        env:
          ORGANICO_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/organico-webhook-comentarios-postgres.cjs
      - name: Check TikTok reconciliation on isolated PostgreSQL
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/tts-canal-reconciliation-postgres.cjs
      - name: Check TikTok complete-rule validation
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/tts-regra-postgres.cjs
      - name: Check disabled journey entry and immutable releases
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: |
          node tests/journey-template-release-postgres.cjs
          node tests/journey-cart-entry-postgres.cjs
      - name: Check paused TikTok collection safeguards
        env:
          CAMPAIGN_PGLITE_MODULE: ../../growth-test-tools/node_modules/@electric-sql/pglite
        run: node tests/tts-cobranca-safety-postgres.cjs
      - name: Save test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-test-results
          path: ${{ runner.temp }}/growth-tests.txt
          retention-days: 7

  tiktok-rule-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: tts_regra_test
          POSTGRES_USER: synthetic
          # Trust is limited to this disposable CI service, no application credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d tts_regra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PostgreSQL test client
        run: npm install --prefix ../postgres-test-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1
      - name: Check independent-session rule contention
        env:
          NODE_PATH: ../postgres-test-tools/node_modules
          TEST_DATABASE_URL: postgres://synthetic@localhost:5432/tts_regra_test
          TTS_TEST_DATABASE_ISOLATED: '1'
        run: node tests/tts-regra-concurrency-postgres.cjs

  journey-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: journey_test
          POSTGRES_USER: synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d journey_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PostgreSQL test client
        run: npm install --prefix ../postgres-test-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1
      - name: Check independent-session journey contention
        env:
          NODE_PATH: ../postgres-test-tools/node_modules
          TEST_DATABASE_URL: postgres://synthetic@localhost:5432/journey_test
          JOURNEY_TEST_DATABASE_ISOLATED: '1'
        run: node tests/journey-concurrency-postgres.cjs

  holdout-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: holdout_test
          POSTGRES_USER: synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d holdout_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PostgreSQL test client
        run: npm install --prefix ../postgres-test-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1
      - name: Check independent-session holdout contention
        env:
          NODE_PATH: ../postgres-test-tools/node_modules
          TEST_DATABASE_URL: postgres://synthetic@localhost:5432/holdout_test
          HOLDOUT_TEST_DATABASE_ISOLATED: '1'
        run: node tests/whatsapp-cart-holdout-concurrency-postgres.cjs

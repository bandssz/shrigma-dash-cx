            -e 'const a=require("node:assert/strict"),fs=require("node:fs"),net=require("node:net"),pg=require("/app/node_modules/pg");const deny=()=>{throw Error("Import attempted I/O");};net.Server.prototype.listen=deny;net.Socket.prototype.connect=deny;pg.Pool.prototype.query=pg.Pool.prototype.connect=pg.Client.prototype.query=pg.Client.prototype.connect=deny;a.equal(process.getuid(),1000);a.equal(process.getgid(),1000);a.equal(require("/app/package.json").name,"shrigma-crm-campaign");a.equal(require("/app/node_modules/pg/package.json").version,"8.13.1");a.deepEqual(fs.readdirSync("/app").sort(),["n8n","node_modules","package-lock.json","package.json","services"]);a.equal(typeof require("/app/services/crm-campaign/server.cjs").createServer,"function");a.equal(typeof require("/app/services/crm-campaign/media.cjs").createMediaExecutor,"function");a.equal(require("node:crypto").createHash("sha256").update(fs.readFileSync("/app/services/crm-campaign/media.cjs")).digest("hex"),"2f288ef9d38160fe5363c478eb43ea84886a84367deaf991bdc56a32034b8ffc");a.equal(Object.keys(require.cache).some(p=>p.endsWith("/services/crm-campaign/main.cjs")),false);'
          CAMPAIGN_RECORD="$RUNNER_TEMP/crm-campaign-media-publication"

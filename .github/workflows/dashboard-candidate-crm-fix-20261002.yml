          test "$(docker image inspect --format '{{index .Config.Labels "com.shrigma.component"}}' "$CAMPAIGN_REF")" = 'crm-campaign'
          docker run --rm --network none --no-healthcheck --read-only --cap-drop ALL --security-opt no-new-privileges \

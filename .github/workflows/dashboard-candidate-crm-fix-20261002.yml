      - name: Publicar somente a tag inédita com token temporário da CI
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          CAMPAIGN_IMAGE="$CRM_CAMPAIGN_REPOSITORY:crm-campaign-media-candidate-$GITHUB_SHA"
          CAMPAIGN_DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/crm-campaign-media-push-config.XXXXXX")"
          export DOCKER_CONFIG="$CAMPAIGN_DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$CAMPAIGN_DOCKER_CONFIG"; rm -f -- "$RUNNER_TEMP/crm-campaign-media-manifest.json" "$RUNNER_TEMP/crm-campaign-media-manifest.error"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          unset GHCR_TOKEN
          # Check again just before push. Concurrency also serializes this job per SHA.
          if docker manifest inspect "$CAMPAIGN_IMAGE" > "$RUNNER_TEMP/crm-campaign-media-manifest.json" 2> "$RUNNER_TEMP/crm-campaign-media-manifest.error"; then
            printf '%s\n' 'Campaign media candidate tag already exists; publication refused.' >&2
            exit 1
          fi
          CAMPAIGN_MANIFEST_ERROR="$(cat "$RUNNER_TEMP/crm-campaign-media-manifest.error")"
          case "$CAMPAIGN_MANIFEST_ERROR" in
            "no such manifest: $CAMPAIGN_IMAGE"|"manifest unknown"|"manifest unknown: manifest unknown") ;;
            *) printf '%s\n' 'Campaign media tag absence could not be confirmed; publication refused.' >&2; exit 1 ;;
          esac
          test "$(docker image inspect --format '{{.Id}}' "$CAMPAIGN_IMAGE")" = "$(cat "$RUNNER_TEMP/crm-campaign-media-built-image-id.txt")"
          docker push "$CAMPAIGN_IMAGE"
          test "$(docker image inspect --format '{{len .RepoDigests}}' "$CAMPAIGN_IMAGE")" = '1'
          CAMPAIGN_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "$CAMPAIGN_IMAGE")"
          [[ "$CAMPAIGN_REF" =~ ^ghcr\.io/bandssz/shrigma-dash-operational-canary@sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$CAMPAIGN_REF" > "$RUNNER_TEMP/crm-campaign-media-pushed-image-ref.txt"

  publish-candidate-image:
    needs: [validate-and-package, native-postgres-manager-proof, native-postgres-v3-install-rollback-proof, native-postgres17-writer-component-proof, native-postgres17-writer-broker-proof, manager-oci-no-sql-preflight, claude-native-pg17-proof, portal-image-oci-preflight]
    # Enable false -> true only in a concretely reviewed and approved carrier.
    # The carrier revision never selects the portal image source revision.
    if: >-
      false &&
      success() &&
      github.event_name == 'push' &&
      github.repository == 'bandssz/shrigma-dash-cx' &&
      github.ref == 'refs/heads/codex/dashboard-candidate-crm-fix-20261002' &&
      contains(github.event.head_commit.message, '[publish-crm-portal-0e488d82431f4985ab6202a422dff4b837c4b1c3]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: crm-portal-candidate-0e488d82431f4985ab6202a422dff4b837c4b1c3
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image-ref: ${{ steps.verify-public-digest.outputs.image_ref }}
      image-digest: ${{ steps.verify-public-digest.outputs.image_digest }}
    env:
      PORTAL_SOURCE_REVISION: '0e488d82431f4985ab6202a422dff4b837c4b1c3'
      PORTAL_PACK_SHA256: 'adb1187fc532b898b85c143e99cc0dfcab98f937f18f99e0c46ced688e112e4a'
      PORTAL_IMAGE: 'ghcr.io/bandssz/shrigma-dash-operational-canary:crm-candidate-0e488d82431f4985ab6202a422dff4b837c4b1c3'
    steps:
      # Workflow carrier SHA and image source SHA are intentionally distinct.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '0e488d82431f4985ab6202a422dff4b837c4b1c3'
          persist-credentials: false
      - name: Confirmar CI concluída da revisão exata antes da construção
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PORTAL_SOURCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          mkdir "$RUNNER_TEMP/crm-portal-publication"
          gh api repos/bandssz/shrigma-dash-cx/actions/runs/37228919950 > "$RUNNER_TEMP/crm-portal-target-run.json"
          gh api 'repos/bandssz/shrigma-dash-cx/actions/runs/37228919950/attempts/1/jobs?per_page=100' > "$RUNNER_TEMP/crm-portal-target-jobs.json"
          python3 - <<'PY_GATE'
          import json,pathlib
          root=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])
          run=json.loads((root/'crm-portal-target-run.json').read_text())
          jobs=json.loads((root/'crm-portal-target-jobs.json').read_text())
          expected={'native-postgres-v3-install-rollback-proof': 'success', 'native-postgres17-writer-component-proof': 'success', 'native-postgres-manager-proof (PostgreSQL 16)': 'success', 'native-postgres-manager-proof (PostgreSQL 17)': 'success', 'native-postgres17-writer-broker-proof': 'success', 'manager-oci-no-sql-preflight': 'success', 'validate-and-package': 'success', 'claude-native-pg17-proof (templates)': 'success', 'claude-native-pg17-proof (gateway)': 'success', 'claude-native-pg17-proof (installer)': 'success', 'claude-native-pg17-proof (audience)': 'success', 'claude-native-pg17-proof (recovery)': 'success', 'claude-native-pg17-proof (template_listener)': 'success', 'publish-crm-provisioner-candidate-image': 'skipped', 'publish-candidate-image': 'skipped', 'publish-crm-campaign-candidate-image': 'skipped', 'portal-image-oci-preflight': 'success'}
          def require(condition):
           if not condition: raise SystemExit('Target CI gate refused.')
          require(run['id']==37228919950 and run['workflow_id']==373226706)
          require(run['path']=='.github/workflows/dashboard-candidate-crm-fix-20261002.yml')
          require(run['event']=='push' and run['head_branch']=='codex/dashboard-candidate-crm-fix-20261002')
          require(run['head_sha']=='0e488d82431f4985ab6202a422dff4b837c4b1c3' and run['status']=='completed' and run['conclusion']=='success')
          require(run['run_attempt']==1)
          require(jobs['total_count']==len(expected) and len(jobs['jobs'])==len(expected))
          require(len({j['name'] for j in jobs['jobs']})==len(expected))
          require({j['name']:j['conclusion'] for j in jobs['jobs']}==expected)
          require(all(j['status']=='completed' for j in jobs['jobs']))
          require(all(j['run_id']==37228919950 and j['run_attempt']==1 and j['head_sha']=='0e488d82431f4985ab6202a422dff4b837c4b1c3' for j in jobs['jobs']))
          proof={k:run[k] for k in ['id','workflow_id','path','event','head_branch','head_sha','status','conclusion','run_attempt','html_url']}
          proof['jobs']=[{k:j[k] for k in ['id','name','status','conclusion','run_id','run_attempt','head_sha']} for j in jobs['jobs']]
          (root/'crm-portal-publication'/'target-ci.json').write_text(json.dumps(proof,sort_keys=True)+'\n')
          PY_GATE
      - name: Construir e conferir o portal exato sem rede no preflight OCI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PORTAL_SOURCE_REVISION"
          PORTAL_DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/crm-portal-build-config.XXXXXX")"
          export DOCKER_CONFIG="$PORTAL_DOCKER_CONFIG"
          trap 'rm -rf -- "$PORTAL_DOCKER_CONFIG"' EXIT
          cat > "$RUNNER_TEMP/crm-portal-oci-preflight.cjs" <<'PORTAL_OCI'
          // Future OCI-only check. Synthetic SQLite files stay in container /tmp.
          'use strict';
          const a=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto');
          const sqlite=require('node:sqlite');
          const revision='0e488d82431f4985ab6202a422dff4b837c4b1c3',pack='adb1187fc532b898b85c143e99cc0dfcab98f937f18f99e0c46ced688e112e4a';
          let stage='node-api';
          (async()=>{
           a.equal(process.versions.node.split('.')[0],'22');
           a.equal(process.platform,'linux');a.equal(process.arch,'x64');
           a.equal(process.getuid(),1000);a.equal(process.getgid(),1000);
           a.equal(typeof sqlite.DatabaseSync,'function');a.equal(typeof sqlite.backup,'function');
           stage='image-pack';
           const I=require('/app/canary-image.cjs'),P=require('/app/artifact-policy.cjs');
           a.deepEqual(fs.readdirSync('/app').sort(),I.IMAGE_FILES);
           const verified=I.verifyImagePack('/app');
           a.deepEqual(verified.pin,{schema:'shrigma_dashboard_canary_image_v1',baseImage:'node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402',sourceRevision:revision,packSha256:pack});
           a.equal(Buffer.byteLength(verified.input),812340);
           const decoded=P.decodePack(verified.input,pack);
           a.equal(decoded.stats.files,56);a.equal(decoded.stats.publicFiles,30);a.equal(decoded.stats.runtimeFiles,26);
           stage='synthetic-backup';
           const root=fs.mkdtempSync('/tmp/crm-portal-sqlite-preflight-');
           const source=root+'/source.sqlite',destination=root+'/backup.sqlite';
           const hash=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
           const schema=db=>db.prepare("SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name").all().map(r=>[r.type,r.name,r.tbl_name,r.sql]);
           const rows=db=>db.prepare('SELECT id,label,payload FROM proof ORDER BY id').all().map(r=>[r.id,r.label,Buffer.from(r.payload).toString('hex')]);
           let writer,reader,copy;
           try{
            writer=new sqlite.DatabaseSync(source);
            writer.exec('PRAGMA journal_mode=DELETE; CREATE TABLE proof(id INTEGER PRIMARY KEY,label TEXT NOT NULL,payload BLOB NOT NULL) STRICT;');
            const insert=writer.prepare('INSERT INTO proof VALUES(?,?,?)');
            insert.run(1,'synthetic',Buffer.from([0,255,1]));insert.run(2,'ação',Buffer.from([]));
            writer.close();writer=null;
            const before=hash(source);
            reader=new sqlite.DatabaseSync(source,{readOnly:true});
            reader.exec('BEGIN');
            const expectedSchema=schema(reader),expectedRows=rows(reader);
            await sqlite.backup(reader,destination);
            a.deepEqual(schema(reader),expectedSchema);a.deepEqual(rows(reader),expectedRows);
            reader.exec('ROLLBACK');reader.close();reader=null;
            copy=new sqlite.DatabaseSync(destination,{readOnly:true});
            a.deepEqual(schema(copy),expectedSchema);a.deepEqual(rows(copy),expectedRows);
            a.equal(copy.prepare('PRAGMA integrity_check').get().integrity_check,'ok');
            copy.close();copy=null;
            stage='source-preservation';
            a.equal(hash(source),before);
            a.deepEqual(fs.readdirSync(root).sort(),['backup.sqlite','source.sqlite']);
            console.log(JSON.stringify({schema:'shrigma_portal_oci_publication_preflight_v1',sourceRevision:revision,packSha256:pack,packBytes:812340,files:56,baseImage:verified.pin.baseImage,nodeVersion:process.versions.node,sqliteVersion:process.versions.sqlite,os:process.platform,processArchitecture:process.arch,uid:process.getuid(),gid:process.getgid(),backupApi:true,sourceBytesPreserved:true,schemaAndRowsPreserved:true,syntheticOnly:true,network:false,hostDatabaseMounted:false}));
           }finally{
            for(const db of [copy,reader,writer])if(db)try{db.close();}catch{}
            fs.rmSync(root,{recursive:true,force:true});
           }

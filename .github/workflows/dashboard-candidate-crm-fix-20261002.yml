name: Dashboard operacional · CRM candidato isolado

'on':
  push:
    branches: ['codex/dashboard-candidate-crm-fix-20261002']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Instalar ferramentas fixadas somente na CI
        run: |
          npm ci --prefix tools/campaign-runtime-build --ignore-scripts --no-audit --no-fund
          npm ci --prefix services/crm-manager-provisioner --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/growth-test-tools" --no-save --ignore-scripts --no-audit --no-fund linkedom@0.18.12 @electric-sql/pglite@0.3.14
      - name: Conferir bundle CRM e segurança do pacote operacional
        env:
          NODE_PATH: ${{ runner.temp }}/growth-test-tools/node_modules
        run: |
          node tools/panel-build/build.cjs --panel=growth --check
          node tools/panel-build/build.cjs --panel=organico --check
          node tools/dashboard-campaign-ui-build.cjs --check
          node --test --test-concurrency=2 --test-timeout=120000 services/dashboard-operational/*.test.cjs tests/dashboard-operational-*.test.cjs tests/config-embed-handshake.test.cjs tests/influ-cac-cliente-novo.test.cjs tests/organico-render.test.cjs
      - name: Validar cadastro privado e RPCs em banco descartável
        env:
          NODE_PATH: ${{ runner.temp }}/growth-test-tools/node_modules
        run: node --test services/crm-manager-provisioner/server.test.cjs tests/crm-manager-provision-postgres.test.cjs tests/crm-manager-role-install.test.cjs tools/crm-manager-read-activation-review/activation.test.cjs
      - name: Exercitar listas, vínculo, recibos e troca de marca
        env:
          NODE_PATH: ${{ runner.temp }}/growth-test-tools/node_modules
        run: node --test tests/growth-campaign-audience-path.test.cjs tests/growth-campaign-catalog-ui.test.cjs tests/growth-campaign-editor.test.cjs tests/growth-campaign-audience-client.test.cjs tests/growth-render.test.cjs
      - name: Conferir entrega CRM e isolamento da biblioteca de mídia
        env:
          NODE_PATH: ${{ runner.temp }}/growth-test-tools/node_modules
          CAMPAIGN_PGLITE_MODULE: ${{ runner.temp }}/growth-test-tools/node_modules/@electric-sql/pglite
        run: node --test tests/claude-*.test.cjs tests/crm-campaign-media.test.cjs tests/crm-campaign-media-page-boundary.test.cjs tests/growth-media.test.cjs
      - name: Conferir executor fechado, supervisão e plano de recursos sem banco ou credenciais
        run: |
          node --test tools/crm-manager-install-review/runtime/run-install.test.cjs tools/crm-manager-install-review/runtime/supervisor/supervisor.test.cjs tools/crm-manager-install-review/runtime/compose/compose.test.cjs
          node --test tools/crm-manager-read-activation-review/runtime/runtime.test.cjs tools/crm-manager-read-activation-review/runtime/supervisor.test.cjs tools/crm-manager-read-activation-review/runtime/independent/durability.test.cjs
          node --test tools/crm-manager-read-activation-review/compose/build-compose.test.cjs
      - name: Provar retenção cifrada e retomada sem repetir instalação
        run: node --test tools/crm-manager-read-credential-custody/*.test.cjs tools/crm-manager-read-activation-review/compose/bootstrap-handoff-preflight.test.cjs
      - name: Validar emissor de edição individual desligado e contratos fechados
        env:
          NODE_PATH: ${{ runner.temp }}/growth-test-tools/node_modules
        run: node --test services/crm-manager-writer/server.test.cjs
      - name: Conferir identidade de edição separada somente em fixture descartável
        env:
          NODE_PATH: ${{ runner.temp }}/growth-test-tools/node_modules
        run: |
          node --test tools/crm-manager-writer-review/writer-policy.test.cjs tools/crm-manager-writer-review/native/native-writer-pure.test.cjs
          node tools/crm-manager-writer-review/writer-provision.test.cjs "$GITHUB_WORKSPACE/tests/crm-manager-provision-postgres.test.cjs" "$RUNNER_TEMP/growth-test-tools/node_modules/@electric-sql/pglite"
          node --require ./tools/crm-manager-writer-review/production/network-guard.cjs --test tools/crm-manager-writer-review/production/installer.test.cjs tools/crm-manager-writer-review/production/profile.test.cjs
      - name: Gerar pacote fechado sem dados nem credenciais
        run: |
          node services/dashboard-operational/build.cjs "$RUNNER_TEMP/shrigma-build"
          node services/dashboard-operational/pack-runtime.cjs "$RUNNER_TEMP/shrigma-build" "$RUNNER_TEMP/shrigma-pack"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/shrigma-pack/source-revision.txt"
      - name: Construir imagem imutável fora do servidor
        run: docker build --file services/dashboard-operational/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" --tag shrigma-dashboard-crm-candidate:ci .
      - name: Construir e conferir emissor desligado sem rede ou credenciais
        run: |
          docker build --file services/crm-manager-provisioner/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" --tag shrigma-crm-manager-provisioner:ci services/crm-manager-provisioner
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' shrigma-crm-manager-provisioner:ci)" = "$GITHUB_SHA"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --memory 128m --memory-swap 128m --cpus 0.25 --pids-limit 32 \
            --entrypoint node shrigma-crm-manager-provisioner:ci \
            -e 'if(process.getuid()!==1000||process.getgid()!==1000)throw Error("UID mismatch"); const s=require("/app/server.cjs"); if(typeof s.createServer!=="function")throw Error("Missing runtime"); console.log("Provisioner module verified; no socket or database started.");'
      - name: Construir leitor de templates e provar modo OFF sem banco
        run: |
          docker build --file services/crm-template-read/Dockerfile --build-arg CRM_TEMPLATE_READ_REVISION="$GITHUB_SHA" --tag shrigma-crm-template-read:ci .
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' shrigma-crm-template-read:ci)" = "$GITHUB_SHA"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m --memory-swap 256m --cpus 0.35 --pids-limit 64 --entrypoint node shrigma-crm-template-read:ci --max-old-space-size=96 -e '
            const a=require("node:assert/strict"),M=require("node:module"),load=M._load;
            M._load=function(name,...rest){if(name==="pg")throw Error("OFF_LOADED_PG");return load.call(this,name,...rest);};
            (async()=>{
              a.equal(process.getuid(),1000);a.equal(process.getgid(),1000);
              a.match(process.env.CRM_TEMPLATE_READ_REVISION,/^[a-f0-9]{40}$/);
              a.equal(process.env.CRM_TEMPLATE_READ_ENABLED,"false");
              const runtime=require("/app/services/crm-template-read/main.cjs").start(process.env,{port:0,host:"127.0.0.1"});
              try{
                const server=runtime.app.server;
                if(!server.listening)await new Promise(resolve=>server.once("listening",resolve));
                const base="http://127.0.0.1:"+server.address().port;
                const h=await fetch(base+"/healthz");a.equal(h.status,200);
                const health=await h.json();a.equal(health.enabled,false);a.equal(health.revision,process.env.CRM_TEMPLATE_READ_REVISION);
                const r=await fetch(base+"/template-read");a.equal(r.status,503);a.deepEqual(await r.json(),{error:"TEMPLATE_READ_DISABLED"});
              }finally{await runtime.stop();}
              console.log("Template image exact revision; UID1000; OFF; no driver or PostgreSQL.");
            })().catch(()=>{console.error("TEMPLATE_OFF_OCI_REFUSED");process.exitCode=1;});'
      - name: Provar limite CRM de 8 MiB na imagem sem rede
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 \
            --memory 512m --memory-swap 512m --cpus 0.5 --pids-limit 64 \
            --user 1000:1000 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/services/dashboard-operational,target=/proof/services/dashboard-operational,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/dashboard-operational-crm-cache-limit.test.cjs,target=/proof/tests/dashboard-operational-crm-cache-limit.test.cjs,readonly" \
            --entrypoint node shrigma-dashboard-crm-candidate:ci \
            --max-old-space-size=128 --test /proof/tests/dashboard-operational-crm-cache-limit.test.cjs
      - name: Validar UID, revisão e volume vazio sem rede
        run: |
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' shrigma-dashboard-crm-candidate:ci)" = "$GITHUB_SHA"
          CANDIDATE_TEST_VOLUME="shrigma-crm-candidate-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker volume rm "$CANDIDATE_TEST_VOLUME" >/dev/null 2>&1 || true' EXIT
          docker volume create "$CANDIDATE_TEST_VOLUME" >/dev/null
          docker run --rm --network none --cap-drop ALL --memory 512m --cpus 0.5 --volume "$CANDIDATE_TEST_VOLUME:/dashboard-data" --entrypoint node shrigma-dashboard-crm-candidate:ci --max-old-space-size=128 -e 'const fs=require("node:fs"),start=require("/app/canary-start.cjs"); if(process.getuid()!==1000||process.getgid()!==1000)throw Error("UID mismatch"); const first=start.prepare(),file="/dashboard-data/runtime-pack.json",inode=fs.statSync(file).ino,bytes=fs.readFileSync(file); start.prepare(); if(fs.statSync(file).ino!==inode||!fs.readFileSync(file).equals(bytes)||fs.readdirSync("/dashboard-data").join()!=="runtime-pack.json")throw Error("Seed changed identity volume"); console.log("Candidate pack verified; UID1000; seed once; no backend or worker started.");'
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-crm-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/shrigma-pack/
          if-no-files-found: error
          retention-days: 7

  native-postgres-manager-proof:
    name: native-postgres-manager-proof (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: crm_manager_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --cpus 1 --memory 512m
          --health-cmd "pg_isready -U postgres -d crm_manager_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Instalar somente dependência fixada do emissor
        run: npm ci --prefix services/crm-manager-provisioner --ignore-scripts --no-audit --no-fund
      - name: Provar SQL, ACL e concorrência no PostgreSQL efêmero da CI
        env:
          CRM_MANAGER_NATIVE_FIXTURE: '1'
          CRM_MANAGER_NATIVE_MAJOR: ${{ matrix.postgres }}
          NODE_PATH: ${{ github.workspace }}/services/crm-manager-provisioner/node_modules
        run: node --test tests/crm-manager-provision-native-postgres.test.cjs

  # Installation and READ activation proof in separate disposable clusters.
  # No server credentials, production issuer activation or deployment.
  native-postgres-v3-install-rollback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Instalar somente o cliente fixado da fixture nativa
        run: npm ci --prefix services/crm-manager-provisioner --ignore-scripts --no-audit --no-fund
      - name: Provar instalação V3 e reversão vazia em PostgreSQL17 descartável
        env:
          CRM_MANAGER_V3_NATIVE_PROOF: '1'
          NODE_PATH: ${{ github.workspace }}/services/crm-manager-provisioner/node_modules
        run: |
          node --test tools/crm-manager-install-review/native-v3-proof-pure.test.cjs
          bash tools/crm-manager-install-review/run-native-v3-proof.sh
          CRM_MANAGER_READ_ACTIVATION_NATIVE_PROOF=1 bash tools/crm-manager-read-activation-review/run-native-proof.sh
          node --test tools/crm-manager-read-activation-review/runtime/native-pure.test.cjs
          READ_RUNTIME_NATIVE_OCI_PROOF=1 bash tools/crm-manager-read-activation-review/run-native-oci-proof.sh
          node tools/crm-manager-read-activation-review/compose/oci-preflight.cjs --pure
          READ_COMPOSE_OCI_PREFLIGHT=1 bash tools/crm-manager-read-activation-review/compose/run-oci-preflight.sh

  native-postgres17-writer-component-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Instalar cliente fixado da fixture nativa
        run: npm ci --prefix services/crm-manager-provisioner --ignore-scripts --no-audit --no-fund
      - name: Provar candidato inativo, locks nativos e reversão vazia
        env:
          CRM_MANAGER_WRITER_NATIVE_PROOF: '1'
          NODE_PATH: ${{ github.workspace }}/services/crm-manager-provisioner/node_modules
        run: |
          bash tools/crm-manager-writer-review/native/run-native-writer-proof.sh
          CRM_MANAGER_V3_NATIVE_PROOF=1 CRM_WRITER_PRODUCTION_NATIVE_PROOF=1 bash tools/crm-manager-install-review/run-native-v3-proof.sh

  native-postgres17-writer-broker-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Conferir fontes e recusa sem autorização nativa
        run: |
          node tools/crm-manager-writer-review/broker/native-broker.test.cjs --pure
          bash -n tools/crm-manager-writer-review/broker/run-native-broker-proof.sh
          bash -n tools/crm-manager-writer-review/broker/run-off-image-proof.sh
      - name: Construir e iniciar somente emissor desligado sem rede
        env:
          CRM_WRITER_IMAGE_OFF_PROOF: '1'
        run: |
          docker build --file services/crm-manager-writer/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" --tag shrigma-crm-manager-writer:ci services/crm-manager-writer
          bash tools/crm-manager-writer-review/broker/run-off-image-proof.sh
      - name: Provar SCRAM, admissão e quatro RPCs em PostgreSQL17 novo e descartável
        env:
          CRM_WRITER_BROKER_NATIVE_PROOF: '1'
        run: bash tools/crm-manager-writer-review/broker/run-native-broker-proof.sh

  manager-oci-no-sql-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Provar transferência de proprietário e observação fechada sem banco
        run: |
          node tools/crm-manager-install-review/native-preflight-ci/preflight.test.cjs
          node tools/crm-manager-install-review/native-preflight-ci/observe.test.cjs
          node tools/crm-manager-install-review/native-preflight-ci/diagnose.test.cjs
          bash -n tools/crm-manager-install-review/native-preflight-ci/run-preflight-ci.sh
          node --require ./tools/crm-manager-read-credential-custody/unit-guard.cjs --test tools/crm-manager-read-credential-custody/manual-reconcile/recovery.test.cjs
          node --require ./tools/crm-manager-read-credential-custody/manual-disable/unit-guard.cjs --test tools/crm-manager-read-credential-custody/manual-disable/manual-disable.test.cjs
          bash -n tools/crm-manager-read-credential-custody/manual-reconcile/oci/run-oci-proof.sh
          bash -n tools/crm-manager-read-credential-custody/manual-disable/run-oci-preflight.sh
      - name: Provar Compose, limites, volume e fsync na imagem imutável sem SQL
        env:
          SHRIGMA_NATIVE_PREFLIGHT_CI: '1'
        run: bash tools/crm-manager-install-review/native-preflight-ci/run-preflight-ci.sh
      - name: Provar bootstrap público e observador com volumes externos sem SQL
        env:
          READ_BOOTSTRAP_HANDOFF_OCI: '1'
        run: bash tools/crm-manager-read-activation-review/compose/run-bootstrap-handoff-preflight.sh
      - name: Provar leitura do diário original sem repetir Stage ou SQL
        env:
          READ_MANUAL_RECONCILE_OCI_PROOF: '1'
          READ_RECONCILE_RUNTIME_DIRECTORY: ${{ github.workspace }}/tools/crm-manager-read-credential-custody
        run: bash tools/crm-manager-read-credential-custody/manual-reconcile/oci/run-oci-proof.sh
      - name: Provar compensação manual desligada com volumes sintéticos sem SQL
        env:
          MANUAL_DISABLE_OCI_PROOF: '1'
        run: bash tools/crm-manager-read-credential-custody/manual-disable/run-oci-preflight.sh

  claude-native-pg17-proof:
    name: claude-native-pg17-proof (${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fixture: [audience, templates, template_listener, recovery, installer, gateway]
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_DB: listmonk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:55440:5432']
        options: >-
          --cpus 1 --memory 512m --memory-swap 512m --pids-limit 128
          --label com.shrigma.claude-native-pg17=${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.fixture }}
          --health-cmd "pg_isready -U postgres -d listmonk"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Instalar somente pg fixado para a fixture
        run: npm ci --prefix services/crm-manager-provisioner --ignore-scripts --no-audit --no-fund
      - name: Conferir guardas sem banco ou sockets
        run: |
          CLAUDE_CI_NODE=$(command -v node)
          env -i PATH=/usr/bin:/bin "$CLAUDE_CI_NODE" --test tools/claude-native-proofs/pg17-ci.test.cjs
      - name: Provar fixture nativa em cluster vazio próprio
        env:
          CLAUDE_NATIVE_PG17_CI: '1'
          CLAUDE_PG17_CASE: ${{ matrix.fixture }}
          CLAUDE_PG17_CONTAINER_ID: ${{ job.services.postgres.id }}
          CLAUDE_PG17_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.fixture }}
        run: |
          CLAUDE_CI_NODE=$(command -v node)
          env -i PATH=/usr/bin:/bin \
            CLAUDE_NATIVE_PG17_CI="$CLAUDE_NATIVE_PG17_CI" \
            CLAUDE_PG17_CASE="$CLAUDE_PG17_CASE" \
            CLAUDE_PG17_CONTAINER_ID="$CLAUDE_PG17_CONTAINER_ID" \
            CLAUDE_PG17_OWNER="$CLAUDE_PG17_OWNER" \
            "$CLAUDE_CI_NODE" --max-old-space-size=128 tools/claude-native-proofs/pg17-ci.cjs --native
      - name: Remover somente serviço e volume próprios
        if: always()
        env:
          CLAUDE_NATIVE_PG17_CI: '1'
          CLAUDE_PG17_CASE: ${{ matrix.fixture }}
          CLAUDE_PG17_CONTAINER_ID: ${{ job.services.postgres.id }}
          CLAUDE_PG17_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.fixture }}
        run: |
          CLAUDE_CI_NODE=$(command -v node)
          env -i PATH=/usr/bin:/bin \
            CLAUDE_NATIVE_PG17_CI="$CLAUDE_NATIVE_PG17_CI" \
            CLAUDE_PG17_CASE="$CLAUDE_PG17_CASE" \
            CLAUDE_PG17_CONTAINER_ID="$CLAUDE_PG17_CONTAINER_ID" \
            CLAUDE_PG17_OWNER="$CLAUDE_PG17_OWNER" \
            "$CLAUDE_CI_NODE" tools/claude-native-proofs/pg17-ci.cjs --cleanup

  # CI evidence only: builds the literal portal revision; never publishes.
  portal-image-oci-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      PORTAL_SOURCE_REVISION: 'a6ae8725e50c728ee8dff670d02a56df7d3be3db'
      PORTAL_PACK_SHA256: '3b90fdd344b0453cc511963eaf4029ad492fffa7622c8e1162c5c2765c4344a1'
      PORTAL_IMAGE: 'ghcr.io/bandssz/shrigma-dash-operational-canary:crm-candidate-a6ae8725e50c728ee8dff670d02a56df7d3be3db'
    steps:
      # Workflow carrier SHA and image source SHA are intentionally distinct.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 'a6ae8725e50c728ee8dff670d02a56df7d3be3db'
          persist-credentials: false
      - name: Confirmar CI concluída da revisão exata antes da construção
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PORTAL_SOURCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          mkdir "$RUNNER_TEMP/crm-portal-publication"
          gh api repos/bandssz/shrigma-dash-cx/actions/runs/37214615265 > "$RUNNER_TEMP/crm-portal-target-run.json"
          gh api 'repos/bandssz/shrigma-dash-cx/actions/runs/37214615265/attempts/1/jobs?per_page=100' > "$RUNNER_TEMP/crm-portal-target-jobs.json"
          python3 - <<'PY_GATE'
          import json,pathlib
          root=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])
          run=json.loads((root/'crm-portal-target-run.json').read_text())
          jobs=json.loads((root/'crm-portal-target-jobs.json').read_text())

          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$PORTAL_REF")" = 'linux/amd64'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PORTAL_REF")" = "$PORTAL_SOURCE_REVISION"

            expected={'image':image_id,'user':'1000:1000','healthcheck':['NONE'],'readOnlyRootfs':True,'network':'none','memory':536870912,'memorySwap':536870912,'nanoCpus':500000000,'pidsLimit':64,'privileged':False,'capAdd':[],'capDrop':['ALL'],'noNewPrivileges':True,'tmpfs':tmpfs,'binds':[{'destination':'/proof','readOnly':True},{'destination':'/source-identity','readOnly':role=='verifier'}]}

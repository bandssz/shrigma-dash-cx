name: Private CRM flow service
on:
  pull_request:
    paths:
      - 'services/crm-flows/**'
      - 'n8n/growth/journey-graph-*'
      - 'growth-email-contract.js'
      - 'growth-email-expressions.js'
      - 'tests/journey-graph-service.test.cjs'
      - 'tools/crm-flow-image/**'
      - '.github/workflows/crm-flow-image-publish.yml'
      - '.github/workflows/crm-flow-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal-service:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boundary and token tests with synthetic loopback HTTP
        run: node --test tests/journey-graph-service.test.cjs
      - name: Offline image and registry guards
        run: python3 -m unittest discover -s tools/crm-flow-image -p 'test_*.py'
      - name: Build pinned production image without credentials
        run: docker build --file services/crm-flows/Dockerfile --tag crm-flows-synthetic .
      - name: Boot disabled image with synthetic configuration and no external network
        run: |
          docker run -d --name crm-flow-proof --network none \
            -e CRM_FLOWS_ENABLED=false -e CRM_FLOWS_REVISION=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e CRM_FLOWS_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            -e CRM_PG_HOST=synthetic_database -e CRM_PG_USER=synthetic -e CRM_PG_PASSWORD=synthetic-password -e CRM_PG_DATABASE=listmonk \
            -e CRM_LISTMONK_ORIGIN=https://email.shrigma.com.br -e CRM_LISTMONK_AUTHORIZATION='Basic c3ludGhldGljOnN5bnRoZXRpYw==' -e CRM_LISTMONK_CACHE_TARGET=synthetic-instance \
            -e CRM_FISH_SHOP=synthetic-fish.myshopify.com -e CRM_FISH_SHOP_ID=gid://shopify/Shop/1 -e CRM_FISH_CLIENT_ID=synthetic-fish -e CRM_FISH_CLIENT_SECRET=synthetic-secret -e CRM_FISH_COLLECTOR=syntheticFish \
            -e CRM_ARISTO_SHOP=synthetic-aristo.myshopify.com -e CRM_ARISTO_SHOP_ID=gid://shopify/Shop/2 -e CRM_ARISTO_CLIENT_ID=synthetic-aristo -e CRM_ARISTO_CLIENT_SECRET=synthetic-secret -e CRM_ARISTO_COLLECTOR=syntheticAristo \
            crm-flows-synthetic
          docker exec crm-flow-proof node -e "(async()=>{for(let i=0;i<30;i++){try{const r=await fetch('http://127.0.0.1:8080/healthz');const b=await r.json();if(r.status===200&&b.execution_enabled===false&&b.revision==='a'.repeat(40))return;}catch{}await new Promise(r=>setTimeout(r,100));}throw Error('Synthetic disabled boot failed');})().catch(e=>{console.error(e.message);process.exit(1)})"
          test "$(docker inspect --format '{{.Config.User}}' crm-flow-proof)" = node
          docker stop --time 10 crm-flow-proof
          test "$(docker inspect --format '{{.State.ExitCode}}' crm-flow-proof)" = 0
      - name: Remove disposable container
        if: always()
        run: docker rm -f crm-flow-proof || true

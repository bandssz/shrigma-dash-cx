name: Private CRM flow service
on:
  pull_request:
    paths:
      - 'services/crm-flows/**'
      - 'n8n/growth/journey-graph-*'
      - 'growth-email-contract.js'
      - 'growth-email-expressions.js'
      - 'tests/journey-graph-service.test.cjs'
      - 'tools/crm-flow-image/**'
      - '.github/workflows/crm-flow-image-publish.yml'
      - '.github/workflows/crm-flow-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boundary and token tests with synthetic loopback HTTP
        run: node --test tests/journey-graph-service.test.cjs
      - name: Offline image and registry guards
        run: python3 -m unittest discover -s tools/crm-flow-image -p 'test_*.py'
      - name: Install OCI copier in the disposable test runner
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Build pinned production image without credentials
        run: |
          docker build --platform linux/amd64 --file services/crm-flows/Dockerfile --tag crm-flows-synthetic:ci \
            --label org.opencontainers.image.source=https://github.com/bandssz/shrigma-dash-cx \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$GITHUB_SHA" \
            --label io.shrigma.crm.execution=off .
      - name: Convert and prove the OCI image OFF with no external network
        run: |
          skopeo copy docker-daemon:crm-flows-synthetic:ci "oci-archive:$RUNNER_TEMP/crm-flows-ci.oci.tar"
          python3 tools/crm-flow-image/smoke.py --source-sha "$GITHUB_SHA" --archive "$RUNNER_TEMP/crm-flows-ci.oci.tar"
      - name: Remove disposable container
        if: always()
        run: docker rm -f crm-flows-oci-ci-proof || true

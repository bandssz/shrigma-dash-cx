nce/deliverables/crm-sprint-final-20261006/revisao-acessos/read-original-custody-lineage-receipt.json","bytes":3236,"sha256":"8851d6482769d0c43768bd95916fde937533297366040ae39e33e65294ab4c20","gitBlobSha1":"df3510dbc498038e677716f8878bcf9c5c3a1cb8"},{"kind":"historical-reference","path":"evidence/deliverables/crm-sprint-final-20261006/presentation-release/release.cjs","bytes":11869,"sha256":"bb2c6f0adb4c05a1e2ee5148395795ace48a657dab4e9ea5108232736d58ffd2","gitBlobSha1":"c3e3aa06165b8c070cac303437f527947a2cdf16"},{"kind":"historical-reference","path":"evidence/deliverables/crm-sprint-final-20261006/presentation-release/payload/manifest.json","bytes":2263,"sha256":"c8de73c9f4afcc31eb9040f44850ad07dd8de3ca7ed8af95a5daf10b7df1aa1b","gitBlobSha1":"7ce38f6748307ee76acac2de322c814def04864e"},{"kind":"historical-reference","path":"evidence/deliverables/crm-sprint-final-20261006/presentation-release/NATIVE-DELIVERY.json","bytes":3731,"sha256":"a5bdf5952a75f341fd6fdb8021f3601373e94ddd0b536cde3d71300d4557d7c5","gitBlobSha1":"4155c1a2e98a1a79d6bec376ebe7cc7fcc81261e"},{"kind":"historical-reference","path":"evidence/deliverables/sprint-20261006/acessos/pr-preparation/CI-RECIBO.json","bytes":1067,"sha256":"1163b4ea2e74bbde29a29ffacdea6a1042983a67bfd34e804b79e9586d0f42a3","gitBlobSha1":"65f068d2310e21d66a5084304977317b3a86b885"},{"kind":"historical-reference","path":"evidence/deliverables/sprint-20261006/acessos/pr-preparation/files/tools/dashboard-active-read-enrollment/verify-source.cjs","bytes":4942,"sha256":"0c0d5d0df097ca2cc51992c11b66a89fb1d5c5bad8d6a8e897b68525651d00c4","gitBlobSha1":"8f84bd6fbbd8fff4a8095a4abe19cdf7a55ff1ab"}];
          const exact=(o,keys)=>o&&Object.getPrototypeOf(o)===Object.prototype&&Object.keys(o).sort().join(',')===keys.slice().sort().join(',');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const blob=b=>crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+b.length+'\0'),b])).digest('hex');
          const same=(a,b)=>['dev','ino','size','mode','uid','gid','nlink','mtimeMs','ctimeMs'].every(k=>a[k]===b[k]);
          const refuse=()=>{throw Error('ENROLLMENT_PUBLIC_MATERIALIZER_REFUSED');};
          function physical(p,dir=false,privateMode){
           if(typeof p!=='string'||!path.isAbsolute(p)||p!==path.resolve(p)||/[\r\n\0]/.test(p)||p.split(path.sep).includes('.private'))refuse();
           const s=fs.lstatSync(p);if(fs.realpathSync(p)!==p||s.isSymbolicLink()||(dir?!s.isDirectory():!s.isFile()||s.nlink!==1))refuse();
           if(privateMode!==undefined&&((s.mode&0o777)!==privateMode||s.uid!==process.getuid()||s.gid!==process.getgid()))refuse();
           return s;
          }
          function readPinned(p,pin,privateMode){
           const s=physical(p,false,privateMode);if(s.size!==pin.bytes)refuse();let fd;
           try{fd=fs.openSync(p,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);if(!same(s,fs.fstatSync(fd)))refuse();const b=fs.readFileSync(fd);if(!same(s,fs.fstatSync(fd))||!same(s,physical(p,false,privateMode))||b.length!==pin.bytes||sha(b)!==pin.sha256||blob(b)!==pin.gitBlobSha1)refuse();return b;}finally{if(fd!==undefined)fs.closeSync(fd);}
          }
          function decoded(){
           const workspace=process.env.GITHUB_WORKSPACE;physical(workspace,true);for(const pin of PINS)readPinned(path.join(workspace,pin.path),pin);
           const transport=readPinned(path.join(workspace,PINS[3].path),PINS[3]);const wrapper=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(transport));
           if(!exact(wrapper,['schema','recordCount','rawBytes','rawSha256','brotliBase64'])||wrapper.schema!=='crm-enrollment-public-corpus-carrier-v1'||wrapper.recordCount!==17||wrapper.rawBytes!==1075030||wrapper.rawSha256!=='86d828f77406020a9a2aa84ce7592695d0a3838d91249b9cda312491337f9795'||typeof wrapper.brotliBase64!=='string'||!/^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(wrapper.brotliBase64))refuse();
           const compressed=Buffer.from(wrapper.brotliBase64,'base64');if(compressed.toString('base64')!==wrapper.brotliBase64)refuse();
           const result=zlib.brotliDecompressSync(compressed,{info:true,maxOutputLength:2097152});if(result.engine.bytesWritten!==compressed.length||result.buffer.length!==wrapper.rawBytes||sha(result.buffer)!==wrapper.rawSha256)refuse();
           const data=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(result.buffer));
           if(!exact(data,['schema','scope','sourceOnly','operational','nativeAdmission','installation','baseSourceRevision','candidateSourceRevision','contractSha256','recordCount','records'])||data.schema!=='crm-enrollment-public-corpus-records-v1'||data.scope!=='source-bytes-only'||data.sourceOnly!==true||data.operational!==false||data.nativeAdmission!==false||data.installation!==false||data.baseSourceRevision!=='c3f0ac329d04903078fc0a558ed89aa9f50696c9'||data.candidateSourceRevision!=='cc82776f8b8ff20b4adfb0eaa6494fa41020c4e9'||data.contractSha256!==PINS[0].sha256||data.recordCount!==17||!Array.isArray(data.records)||data.records.length!==17)refuse();
           const contract=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(readPinned(path.join(workspace,PINS[0].path),PINS[0])));
           const expectedContract=[{path:'base/runtime-pack.json',bytes:contract.basePack.bytes,sha256:contract.basePack.transportSha256},...contract.delta.map(p=>({path:'delta/'+p.path,bytes:p.afterBytes,sha256:p.afterSha256})),...contract.historicalReferences.map(p=>({path:'evidence/'+p.path,bytes:p.bytes,sha256:p.sha256}))];
           if(expectedContract.length!==17||contract.enabled!==false||contract.basePack.runtimeFiles!==28||contract.delta.length!==2||contract.historicalReferences.length!==14)refuse();
           const seen=new Set();return data.records.map(record=>{
            if(!exact(record,['kind','path','encoding','bytes','sha256','gitBlobSha1','content'])||typeof record.path!=='string'||seen.has(record.path)||record.encoding!=='utf8'||typeof record.content!=='string')refuse();seen.add(record.path);
            const pin=RECORDS.find(p=>p.path===record.path),cp=expectedContract.find(p=>p.path===record.path);if(!pin||!cp||!/^([a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_.-]+$/.test(record.path)||record.path.split('/').some(p=>p==='.'||p==='..'||p.startsWith('.'))||record.kind!==pin.kind||record.bytes!==pin.bytes||record.sha256!==pin.sha256||record.gitBlobSha1!==pin.gitBlobSha1||cp.bytes!==pin.bytes||cp.sha256!==pin.sha256)refuse();
            const bytes=Buffer.from(record.content,'utf8');if(new TextDecoder('utf-8',{fatal:true}).decode(bytes)!==record.content||bytes.length!==pin.bytes||sha(bytes)!==pin.sha256||blob(bytes)!==pin.gitBlobSha1)refuse();return {pin,bytes};
           });
          }
          function writeRecords(root,records){
           for(const {pin,bytes} of records){let dir=root;for(const part of pin.path.split('/').slice(0,-1)){dir=path.join(dir,part);if(!fs.existsSync(dir))fs.mkdirSync(dir,{mode:0o700});physical(dir,true,0o700);}
            const file=path.join(root,pin.path),fd=fs.openSync(file,fs.constants.O_WRONLY|fs.constants.O_CREAT|fs.constants.O_EXCL|fs.constants.O_NOFOLLOW,0o600);try{fs.writeFileSync(fd,bytes);fs.fsyncSync(fd);if((fs.fstatSync(fd).mode&0o777)!==0o600)refuse();}finally{fs.closeSync(fd);}readPinned(file,pin,0o600);
           }
          }
          function verify(root,records){
           physical(root,true,0o700);const expected=new Set(records.map(r=>r.pin.path)),dirs=new Set(['']);for(const f of expected){let d=path.posix.dirname(f);while(d!=='.'){dirs.add(d);d=path.posix.dirname(d);}}
           const seen=[],inodes=new Set();function walk(dir,rel=''){physical(dir,true,0o700);for(const name of fs.readdirSync(dir)){const file=path.join(dir,name),key=rel?rel+'/'+name:name,s=fs.lstatSync(file);if(s.isSymbolicLink())refuse();if(s.isDirectory()){if(!dirs.has(key))refuse();walk(file,key);}else{if(!expected.has(key))refuse();const pin=records.find(r=>r.pin.path===key).pin;const stat=physical(file,false,0o600),inode=stat.dev+':'+stat.ino;if(inodes.has(inode))refuse();inodes.add(inode);readPinned(file,pin,0o600);seen.push(key);}}}walk(root);if(seen.length!==17||seen.sort().join('\0')!==[...expected].sort().join('\0'))refuse();
          }
          function main(){
           process.umask(0o077);const records=decoded(),temp=process.env.RUNNER_TEMP;physical(temp,true);
           const output=process.env.GITHUB_OUTPUT;const outputStat=physical(output);if(outputStat.uid!==process.getuid())refuse();
           let root;try{root=fs.mkdtempSync(path.join(temp,'crm-enrollment-public-'));physical(root,true,0o700);writeRecords(root,records);verify(root,records);
            const values={base_pack:path.join(root,'base/runtime-pack.json'),delta_dir:path.join(root,'delta'),evidence_root:path.join(root,'evidence')};const fd=fs.openSync(output,fs.constants.O_WRONLY|fs.constants.O_APPEND|fs.constants.O_NOFOLLOW);try{if(!same(outputStat,fs.fstatSync(fd)))refuse();fs.writeFileSync(fd,Object.entries(values).map(([k,v])=>k+'='+v+'\n').join(''));fs.fsyncSync(fd);}finally{fs.closeSync(fd);}
            console.log(JSON.stringify({state:'public-source-fixtures-materialized',records:17,sourceOnly:true,operational:false}));
           }catch(e){if(root){physical(root,true,0o700);fs.rmSync(root,{recursive:true,force:true});}throw e;}
          }
          try{main();}catch{console.error('ENROLLMENT_PUBLIC_MATERIALIZER_REFUSED');process.exitCode=1;}
          NODE
      - name: Default OFF and mandatory fifteen source-only cases
        shell: bash
        env:
          ENROLLMENT_PUBLIC_BASE_PACK: ${{ steps.materialize.outputs.base_pack }}
          ENROLLMENT_PUBLIC_DELTA_DIR: ${{ steps.materialize.outputs.delta_dir }}
          ENROLLMENT_EVIDENCE_ROOT: ${{ steps.materialize.outputs.evidence_root }}
        run: |
          set -euo pipefail
          umask 077
          node --check tools/dashboard-runtime-enrollment-source/validate-source.cjs
          node --check tools/dashboard-runtime-enrollment-source/validate-source.test.cjs
          node tools/dashboard-runtime-enrollment-source/validate-source.cjs | node -e "let s='';process.stdin.on('data',b=>s+=b);process.stdin.on('end',()=>{const r=JSON.parse(s);if(r.state!=='disabled'||r.code!=='DEFAULT_OFF'||r.nativeAdmission!==false||r.installation!==false||r.operational!==false)process.exit(1);console.log(JSON.stringify(r));});"
          node --test --test-concurrency=1 --test-reporter=tap tools/dashboard-runtime-enrollment-source/validate-source.test.cjs | tee "$RUNNER_TEMP/runtime-enrollment-source.tap"
          node - "$RUNNER_TEMP/runtime-enrollment-source.tap" <<'NODE'

name: CRM runtime enrollment source only
on:
  pull_request:
    branches: [codex/crm-mvp-controls-source-20261006]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/dashboard-runtime-enrollment-source/contract.json
      - tools/dashboard-runtime-enrollment-source/validate-source.cjs
      - tools/dashboard-runtime-enrollment-source/validate-source.test.cjs
      - tools/dashboard-runtime-enrollment-source/public-corpus.json
      - .github/workflows/crm-runtime-enrollment-source.yml
permissions:
  contents: read
concurrency:
  group: crm-runtime-enrollment-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-only:
    if: github.repository == 'bandssz/shrigma-dash-cx' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22.23.3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Closed five-path source gate before decode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          const BASE='bc5efd57f40ba798a981c67a5937be084e441eaf';
          const PINS=[{"path":"tools/dashboard-runtime-enrollment-source/contract.json","bytes":9642,"sha256":"10fce0ab0752bf2d7208226859cd777f734a266cdf4281b5ad5d7a0e11ca85c0","gitBlobSha1":"94208504e81843637f966d20ea44e0e1fa61fafa"},{"path":"tools/dashboard-runtime-enrollment-source/validate-source.cjs","bytes":9860,"sha256":"eb3f98a41c267c3f9c842f091fcdf3e5426c7ab7ae49ec1896abd434e3f8f9bf","gitBlobSha1":"1b013ed61ef709de107bd6424dd3ae39960fab4c"},{"path":"tools/dashboard-runtime-enrollment-source/validate-source.test.cjs","bytes":9032,"sha256":"e3b5135623665aae0ed453939dd08e39e3e128d1dd74ec55fe7df398c58e4121","gitBlobSha1":"f2c9ce8b5e39e114f797834780b2b8797f567c89"},{"path":"tools/dashboard-runtime-enrollment-source/public-corpus.json","bytes":905315,"sha256":"6697df85686021f6ed516b47a673d26d927571375dbd76b63baf9e1a9264f337","gitBlobSha1":"508e0430ee406d523cdd4726fb7a7c4d61ab9dc3"}];
          const paths=[...PINS.map(x=>x.path),'.github/workflows/crm-runtime-enrollment-source.yml'].sort();
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8',maxBuffer:4*1024*1024}).trim();
          const fail=()=>{throw Error('ENROLLMENT_SOURCE_GATE_REFUSED');};
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const head=process.env.EXPECTED_HEAD;
          if(process.version!=='v22.23.3'||!/^[a-f0-9]{40}$/.test(head||'')||process.env.PR_BASE_SHA!==BASE||process.env.PR_HEAD_REPO!=='bandssz/shrigma-dash-cx'||process.env.PR_BASE_REPO!=='bandssz/shrigma-dash-cx'||process.env.PR_HEAD_REF!=='codex/crm-runtime-enrollment-source-20261006'||process.env.PR_BASE_REF!=='codex/crm-mvp-controls-source-20261006')fail();
          if(git('rev-parse','HEAD')!==head||git('rev-parse',BASE+'^{commit}')!==BASE||git('merge-base',BASE,head)!==BASE)fail();
          const changed=cp.execFileSync('git',['diff','--name-status','--no-renames','-z',BASE,head]).toString('utf8').split('\0');changed.pop();const changes=[];
          for(let i=0;i<changed.length;i+=2){if(changed[i]!=='A'||typeof changed[i+1]!=='string')fail();changes.push(changed[i+1]);}
          if(!same(changes.sort(),paths)||git('status','--porcelain','--untracked-files=all')!=='')fail();
          const tree=ref=>new Map(cp.execFileSync('git',['ls-tree','-r','-z','--full-tree',ref]).toString('utf8').split('\0').filter(Boolean).map(line=>{const tab=line.indexOf('\t');return [line.slice(tab+1),line.slice(0,tab)];}));
          const before=tree(BASE),after=tree(head);
          for(const [file,pin] of before)if(after.get(file)!==pin)fail();
          if(after.size!==before.size+5)fail();
          for(const file of paths)if(!after.get(file)?.startsWith('100644 blob '))fail();
          for(const pin of PINS){
           const file=path.join(process.env.GITHUB_WORKSPACE,pin.path),s=fs.lstatSync(file);if(!s.isFile()||s.isSymbolicLink()||s.nlink!==1||fs.realpathSync(file)!==file)fail();
           const b=fs.readFileSync(file),blob=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+b.length+'\0'),b])).digest('hex');
           if(b.length!==pin.bytes||crypto.createHash('sha256').update(b).digest('hex')!==pin.sha256||blob!==pin.gitBlobSha1||after.get(pin.path)!=='100644 blob '+blob)fail();
          }
          const contract=JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,PINS[0].path),'utf8'));
          if(contract.enabled!==false||contract.scope!=='source-bytes-only'||Object.values(contract.authority).some(v=>v!==false))fail();
          console.log(JSON.stringify({state:'exact-five-new-source-paths-preserved-parent',base:BASE,head,sourceOnly:true,operational:false}));
          NODE
      - name: Materialize only seventeen pinned public source inputs
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),zlib=require('node:zlib');
          const PINS=[{"path":"tools/dashboard-runtime-enrollment-source/contract.json","bytes":9642,"sha256":"10fce0ab0752bf2d7208226859cd777f734a266cdf4281b5ad5d7a0e11ca85c0","gitBlobSha1":"94208504e81843637f966d20ea44e0e1fa61fafa"},{"path":"tools/dashboard-runtime-enrollment-source/validate-source.cjs","bytes":9860,"sha256":"eb3f98a41c267c3f9c842f091fcdf3e5426c7ab7ae49ec1896abd434e3f8f9bf","gitBlobSha1":"1b013ed61ef709de107bd6424dd3ae39960fab4c"},{"path":"tools/dashboard-runtime-enrollment-source/validate-source.test.cjs","bytes":9032,"sha256":"e3b5135623665aae0ed453939dd08e39e3e128d1dd74ec55fe7df398c58e4121","gitBlobSha1":"f2c9ce8b5e39e114f797834780b2b8797f567c89"},{"path":"tools/dashboard-runtime-enrollment-source/public-corpus.json","bytes":905315,"sha256":"6697df85686021f6ed516b47a673d26d927571375dbd76b63baf9e1a9264f337","gitBlobSha1":"508e0430ee406d523cdd4726fb7a7c4d61ab9dc3"}],RECORDS=[{"kind":"base-pack","path":"base/runtime-pack.json","bytes":827816,"sha256":"3b7ffcb0095a723402bc37ed3187ccab1e05f27b1e27cff8d1a9699011972be4","gitBlobSha1":"508b7765caddc3b9bd33d0858dc78eb8fa1bf130"},{"kind":"delta","path":"delta/auth.cjs","bytes":112250,"sha256":"6579c3bffffd73f09d6e2950d010ce72ac08d5e579b7688013cb0f56cfab92bb","gitBlobSha1":"fa7e2b040c17cfac7db3ea6e3af8bd8cca94dd1f"},{"kind":"delta","path":"delta/crm-manager-journal.cjs","bytes":25484,"sha256":"585d5dbabd920b53061dae362ff3c1be9c526195f66ae9e4f52987c8a84c9ea5","gitBlobSha1":"76e4efd5472e5d1fb251f3a47efc3a84f444fca7"},{"kind":"historical-reference","path":"evidence/deliverables/crm-sprint-final-20261005/revisao-acessos/original-runtime-master-startup-v2/program.cjs","bytes":23039,"sha256":"ec222c5e51838b1059e81577d41824df9e267073add4631a4f2ce82fd936a4b1","gitBlobSha1":"53e4a1eb4730464944e98c185f217dcf4cfa6c03"},{"kind":"historical-reference","path":"evidence/deliverables/crm-sprint-final-20261005/revisao-acessos/original-runtime-master-startup-v2/controller.cjs","bytes":3017,"sha256":"1f4a9fef0113f5d7a1267d8
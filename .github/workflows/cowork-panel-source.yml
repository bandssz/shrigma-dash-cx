      - name: Executar somente os casos focais C1 C2 e montagens
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export NODE_PATH="$RUNNER_TEMP/cowork-panel-test-tools/node_modules"
          export CRM_C1_FILES_DIRECTORY="$GITHUB_WORKSPACE"
          export CRM_C2_FILES_DIRECTORY="$GITHUB_WORKSPACE"
          # Pure RAM callbacks/DTOs and real local UMD components. No transport/store/provider.
          set +e
          node --test --test-reporter=tap --test-timeout=120000 tests/affiliates-v2/affiliates-v2.test.cjs > "$RUNNER_TEMP/cowork-C1.tap" 2>&1
          c1=$?
          node --test --test-reporter=tap --test-timeout=120000 tests/organic-v2/data-states.test.cjs tests/organic-v2/lifecycle.test.cjs tests/organic-v2/links.test.cjs tests/organic-v2/pending-journal-root.test.cjs tests/organic-v2/static-guard.test.cjs tests/organic-v2/links-recovery.test.cjs tests/organic-v2/draft-intent-root.test.cjs > "$RUNNER_TEMP/cowork-C2.tap" 2>&1
          c2=$?
          node --test --test-reporter=tap --test-timeout=120000 tests/influs-affiliates-mount.test.cjs tests/influs-affiliates-mount-lifecycle.test.cjs tests/root-mounts/organic-v2-mount.test.cjs tests/mvp-root-integration/cowork-binding-and-journal.test.cjs > "$RUNNER_TEMP/cowork-mounts.tap" 2>&1
          mounts=$?
          set -e
          cat "$RUNNER_TEMP/cowork-C1.tap" "$RUNNER_TEMP/cowork-C2.tap" "$RUNNER_TEMP/cowork-mounts.tap"
          test "$c1" -eq 0 && test "$c2" -eq 0 && test "$mounts" -eq 0
          node <<'NODE_COUNTS'
          const fs=require('node:fs'),path=require('node:path');
          for(const [name,count]of [['cowork-C1.tap',23],['cowork-C2.tap',61],['cowork-mounts.tap',34]]){
            const tap=fs.readFileSync(path.join(process.env.RUNNER_TEMP,name),'utf8');
            for(const [field,expected]of Object.entries({tests:count,pass:count,fail:0,cancelled:0,skipped:0,todo:0})){
              const seen=[...tap.matchAll(new RegExp('^# '+field+' ([0-9]+)$','gm'))].map(x=>Number(x[1]));
              if(seen.length!==1||seen[0]!==expected)throw Error('SOURCE_COUNTS_REFUSED');
            }
          }
          console.log('SYNTHETIC_PANEL_CASES_CONFIRMED=118;OPERATIONAL=false');
          NODE_COUNTS
      - name: Revalidar fonte fechada depois dos checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          node "$RUNNER_TEMP/cowork-panel-source-gate.cjs"

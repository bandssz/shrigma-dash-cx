name: Cowork panels source Node22

# Proposal only: Root chooses/freezes the branch and supplies the closed33-file carrier.
# Separate source checks; no image, deployment, database, gateway or operational admission.
'on':
  push:
    branches: [codex/cowork-panel-source-20261006]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: cowork-panel-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  panel-source-node22:
    if: github.repository == 'bandssz/shrigma-dash-cx' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == 'bandssz/shrigma-dash-cx' && github.head_ref == 'codex/cowork-panel-source-20261006'))

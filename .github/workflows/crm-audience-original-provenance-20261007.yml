name: Original audience context availability
'on':
  push:
    branches: [codex/crm-audience-provenance-20261007]
permissions:
  contents: read
concurrency:
  group: original-audience-provenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify exact installed base and prepare immutable local baseline
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),{execFileSync}=require('node:child_process'),git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim(),base='7f8ccbe88c9781effaa5e88ed647a2e56cfeedd9';
          a.equal(git('merge-base',base,'HEAD'),base);a.equal(git('rev-parse',base+'^{tree}'),'efac986a2282ba9c577eb6fd66671bf8bc916d09');
          a.deepEqual(git('diff','--name-only',base,'HEAD').split('\n').sort(),['.github/workflows/crm-audience-original-provenance-20261007.yml','tests/audience-context-availability/original.test.cjs'].sort());a.equal(git('diff','--name-only','--diff-filter=D',base,'HEAD'),'');
          const inputs=path.join(process.env.RUNNER_TEMP,'original-audience-context-base');fs.mkdirSync(inputs,{mode:0o755});for(const n of ['segment-audience-api.cjs','segment-audience-store.cjs','segment-audience-context-review.cjs','segment-audience-contract.js','segment-audience-review.cjs','segment-shopify-facts.cjs','segment-recorded-origin.cjs'])fs.writeFileSync(path.join(inputs,n),execFileSync('git',['show','5ccb543a48db3e2ed8b3ee10c319d8000644d90f:n8n/growth/'+n]),{mode:0o444});fs.appendFileSync(process.env.GITHUB_ENV,'SHRIGMA_AUDIENCE_CONTEXT_INPUTS='+inputs+'\n');console.log(JSON.stringify({installedBasePreserved:true,newSql:false,newIssuer:false,replayedOperation:false,operational:false}));
          NODE
      - name: Build the unchanged original service container around the reviewed context GET addition
        run: docker build --pull --platform linux/amd64 --tag shrigma-original-audience:${{ github.sha }} --file services/crm-audience/Dockerfile .
      - name: Verify actual non-root image with exact original dependencies, no external network or database
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --memory 256m --tmpfs /tmp:rw,noexec,nosuid,mode=1777 --env CRM_AUDIENCE_SHOPIFY_PRODUCT_SEMANTICS=v2 --env SHRIGMA_AUDIENCE_CONTEXT_INPUTS=/tmp/original-inputs --mount "type=bind,src=$SHRIGMA_AUDIENCE_CONTEXT_INPUTS,dst=/tmp/original-inputs,readonly" --mount "type=bind,src=$GITHUB_WORKSPACE/tests/audience-context-availability/original.test.cjs,dst=/app/tests/audience-context-availability/original.test.cjs,readonly" --entrypoint node shrigma-original-audience:${{ github.sha }} --test /app/tests/audience-context-availability/original.test.cjs
          docker run --rm --network none --read-only --entrypoint node shrigma-original-audience:${{ github.sha }} -e 'const a=require("node:assert/strict");a.equal(process.getuid(),1000);a.equal(process.version,"v22.23.3");console.log(JSON.stringify({schema:"shrigma-original-audience-image-v1",node:process.version,uid:process.getuid(),originalContextAvailabilityContract:true,newSql:false,productionIdentityUsed:false,productionDatabaseUsed:false,operational:false}))'

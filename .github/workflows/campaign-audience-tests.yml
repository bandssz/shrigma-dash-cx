name: Campaign audience review
on:
  pull_request:
    paths:
      - 'campaign-contract.js'
      - 'n8n/growth/campaign-*'
      - 'tests/campaign-*'
      - 'tests/fixtures/campaign-*-pre-audience.sql'
      - '.github/workflows/campaign-audience-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: campaign_audience_test
          POSTGRES_USER: synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d campaign_audience_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated test dependencies
        run: npm install --prefix ../campaign-test-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1 @electric-sql/pglite@0.3.14
      - name: Audience SQL and migration on isolated engine
        env:
          NODE_PATH: ../campaign-test-tools/node_modules
        run: |
          node tests/campaign-audience-postgres.cjs
          node tests/campaign-audience-migration-postgres.cjs
      - name: Concurrent independent sessions
        env:
          NODE_PATH: ../campaign-test-tools/node_modules
          TEST_DATABASE_URL: postgres://synthetic@localhost:5432/campaign_audience_test
          CAMPAIGN_TEST_DATABASE_ISOLATED: '1'
        run: node tests/campaign-audience-concurrency-postgres.cjs

name: Candidate graph source and release
on:
  pull_request:
    paths:
      - 'n8n/growth/journey-graph-*'
      - 'growth-email-*.js'
      - 'tests/journey-graph-source*'
      - 'tests/journey-graph-release*'
      - 'tests/journey-graph-material.test.cjs'
      - 'tests/sql/journey-collector-fixture.sql'
      - '.github/workflows/journey-graph-source-release-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-release-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: journey_graph_source_test
          POSTGRES_USER: synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d journey_graph_source_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated test dependencies
        run: npm install --prefix ../graph-source-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1 @electric-sql/pglite@0.3.14
      - name: Source and release regression with integrated materialization
        env:
          NODE_PATH: ../graph-source-tools/node_modules
        run: node --test tests/journey-graph-source.test.cjs tests/journey-graph-release.test.cjs tests/journey-graph-source-release.test.cjs tests/journey-graph-material.test.cjs
      - name: Source concurrency and fresh native guard reads
        env:
          NODE_PATH: ../graph-source-tools/node_modules
          TEST_DATABASE_URL: postgres://synthetic@localhost:5432/journey_graph_source_test
          GRAPH_TEST_DATABASE_ISOLATED: '1'
        run: node tests/journey-graph-source-postgres.cjs
      - name: Create separate disposable release database
        env:
          NODE_PATH: ../graph-source-tools/node_modules
        run: |
          node - <<'JS'
          const {Client}=require('pg');
          (async()=>{const c=new Client({connectionString:'postgres://synthetic@localhost:5432/journey_graph_source_test'});await c.connect();try{await c.query('CREATE DATABASE journey_graph_release_test');}finally{await c.end();}})().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
      - name: Immutable release concurrency and receipt atomicity
        env:
          NODE_PATH: ../graph-source-tools/node_modules
          TEST_DATABASE_URL: postgres://synthetic@localhost:5432/journey_graph_release_test
          GRAPH_TEST_DATABASE_ISOLATED: '1'
        run: node tests/journey-graph-release-postgres.cjs

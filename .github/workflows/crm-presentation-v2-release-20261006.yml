          const BASE='90c8da5035fcf01ccbb6f75384259df703518abb',TREE='b5bc930e178a1590a741892561aa271aa51f6c09',REPO='bandssz/shrigma-dash-cx',BRANCH='codex/crm-presentation-v2-release-20261006',BASE_BRANCH='codex/cowork-panel-source-20261006',CUSTODY='tools/crm-presentation-v2/source-custody.json',WORKFLOW='.github/workflows/crm-presentation-v2-release-20261006.yml';
          assert.equal(process.version,'v22.23.3');assert.equal(process.env.GITHUB_REPOSITORY,REPO);

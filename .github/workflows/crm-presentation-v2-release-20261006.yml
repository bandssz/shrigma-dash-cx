          set -euo pipefail
          umask 077
          ci_dir="$(mktemp -d "$RUNNER_TEMP/crm-presentation-v2.XXXXXX")"
          printf 'CI_PRIVATE_DIR=%s\nDOCKER_CONFIG=%s/docker\n' "$ci_dir" "$ci_dir" >> "$GITHUB_ENV"
          mkdir -m 0700 "$ci_dir/docker"

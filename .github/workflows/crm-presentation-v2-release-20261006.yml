name: CRM presentation V2 custody and image
'on':
  pull_request:
    branches: [codex/cowork-panel-source-20261006]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [codex/crm-presentation-v2-release-20261006]
permissions:
  contents: read
concurrency:
  group: crm-presentation-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.repository == 'bandssz/shrigma-dash-cx' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/crm-presentation-v2-release-20261006'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/bandssz/shrigma-dash-crm-presentation-v2
    outputs:
      source_head: ${{ steps.custody.outputs.source_head }}

          if(process.env.GITHUB_EVENT_NAME==='pull_request'){const pr=event.pull_request;assert.equal(pr.head.repo.full_name,REPO);assert.equal(pr.base.repo.full_name,REPO);assert.equal(pr.head.ref,BRANCH);assert.equal(pr.base.ref,BASE_BRANCH);head=pr.head.sha;assert.match(pr.base.sha,/^[0-9a-f]{40}$/);execFileSync('git',['merge-base','--is-ancestor',BASE,pr.base.sha]);}
          else{assert.equal(process.env.GITHUB_EVENT_NAME,'push');assert.equal(process.env.GITHUB_REF,'refs/heads/'+BRANCH);assert.equal(event.repository.full_name,REPO);head=process.env.GITHUB_SHA;}
          assert.match(head,/^[0-9a-f]{40}$/);const git=args=>execFileSync('git',args,{encoding:'utf8',maxBuffer:8*1024*1024});
          assert.equal(git(['rev-parse','HEAD']).trim(),head);assert.equal(git(['rev-parse',BASE+'^{tree}']).trim(),TREE);execFileSync('git',['merge-base','--is-ancestor',BASE,head]);

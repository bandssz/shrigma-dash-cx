name: Campaign scanner isolated native and OCI (OFF, no deployment)
on:
  push:
    branches:
      - codex/campaign-scan-diagnostic-20261008
    paths:
      - '.github/workflows/campaign-scan-snapshot-native-image.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify-measured-native-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REGULAR_NATIVE_PROOF_ISOLATED: '1'
    steps:
      - name: Checkout original source that passed eight diagnostic cases
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7c46c0b51525918b7ec1b41e9a8b433e29ec4307
          persist-credentials: false
      - name: Checkout unchanged installed proof recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a908beed2860fb90a1b3891f85e64cbc8040ab22
          path: _baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Retrieve exact successful measured artifact through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/bandssz/shrigma-dash-cx/actions/runs/37872202516 > "$RUNNER_TEMP/measured-run.json"
          gh api repos/bandssz/shrigma-dash-cx/actions/artifacts/11591027498 > "$RUNNER_TEMP/measured-artifact.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'measured-run.json').read_text())
          artifact=json.loads((root/'measured-artifact.json').read_text())
          assert run['id']==37872202516 and run['head_sha']=='6d1cc053950d8a2efbd54d4158481184d4f166d9'
          assert run['status']=='completed' and run['conclusion']=='success'
          assert artifact['id']==11591027498 and artifact['name']=='campaign-scanner-candidate-off'
          assert artifact['workflow_run']['id']==run['id'] and not artifact['expired']
          assert artifact['size_in_bytes']==22467029
          assert artifact['digest']=='sha256:a2d8d939427662b4b0ce559ccb304ed9268ac1e4ed520adc4ec5ceb54b49e8d4'
          PY
          gh run download 37872202516 --repo bandssz/shrigma-dash-cx --name campaign-scanner-candidate-off --dir "$RUNNER_TEMP/scan-package"
      - name: Verify actual binary and original native proof inputs before execution
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'scan-package'
          manifest=json.loads((root/'candidate/manifest.json').read_text())
          assert manifest['status']=='CANDIDATE_OFF_NOT_DEPLOYED' and manifest['target']=='linux_amd64'
          assert manifest['binary_sha256']=='6c8b92fd87c62f562c81f6aa17253f11a382743a0dfa910d0cf5df2f369d1601'
          assert hashlib.sha256((root/'candidate/candidate/listmonk').read_bytes()).hexdigest()==manifest['binary_sha256']
          assert manifest['asset_count']==130 and manifest['changed_assets']==['/queries/campaigns.sql']
          assert manifest['query_sha256']=='084a9493713b21b618d24daae98b38db59fb84febf0c367914bea1ed7aa84c2d'
          assert manifest['source_lock_sha256']==hashlib.sha256(Path('tools/listmonk-regular-build/upstream.lock.json').read_bytes()).hexdigest()
          paths=['tools/listmonk-regular-build/native_proof.py','tests/segment-regular-native-fixture.cjs','tools/listmonk-regular-package/build.py','tools/listmonk-regular-package/image.py','tools/listmonk-ab-build/build.py']
          paths += ['n8n/growth/'+p for p in ('segment-audience-store.sql','campaign-provider.sql','segment-campaign-binding.sql','ab-experiment-core.sql','ab-experiment-selection.sql','ab-audience-prepare.sql','segment-listmonk-selection.sql','segment-regular-readiness.sql','segment-regular-delivery.sql','segment-runtime-access.sql','segment-regular-recovery.sql','segment-regular-worker-lease.sql','segment-regular-operation-guard.sql','segment-regular-admission.sql','segment-shopify-facts.sql','segment-shopify-selection.sql','ab-audience-regular.sql')]
          for path in paths:
              assert Path(path).read_bytes()==(Path('_baseline')/path).read_bytes(),path
          print(json.dumps({'status':'EXACT_MEASURED_BINARY_ORIGINAL_PROOF_INPUTS','binary_sha256':manifest['binary_sha256'],'preserved_inputs':len(paths)}))
          PY
      - name: Install pinned disposable PostgreSQL and image transport in the isolated runner
        run: |
          npm install --prefix "$RUNNER_TEMP/scan-test-tools" --no-save --ignore-scripts --no-audit --no-fund pg@8.23.0 @embedded-postgres/linux-x64@17.10.0-beta.17
          (cd "$RUNNER_TEMP/scan-test-tools/node_modules/@embedded-postgres/linux-x64" && node scripts/hydrate-symlinks.js)
          "$RUNNER_TEMP/scan-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin/postgres" --version
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Run measured candidate only against disposable loopback PostgreSQL and SMTP
        run: |
          mkdir -p "$RUNNER_TEMP/scan-native"
          python3 tools/listmonk-regular-build/native_proof.py --binary "$RUNNER_TEMP/scan-package/candidate/candidate/listmonk" --report "$RUNNER_TEMP/scan-native/native-proof.json" --pg-bin "$RUNNER_TEMP/scan-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin" --source-dir "$RUNNER_TEMP/scan-package/candidate/source/listmonk" --runtime-dir "$RUNNER_TEMP/scan-native" --node-path "$RUNNER_TEMP/scan-test-tools/node_modules"
      - name: Build OFF OCI from the same binary and freshly matched native proof
        run: |
          python3 tools/listmonk-regular-package/image.py --package "$RUNNER_TEMP/scan-package/candidate" --native-proof "$RUNNER_TEMP/scan-native/native-proof.json" --revision 7c46c0b51525918b7ec1b41e9a8b433e29ec4307 --out "$RUNNER_TEMP/scan-image"
          cat "$RUNNER_TEMP/scan-image/image-proof.json"
      - name: Preserve OFF OCI and corresponding source with proofs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign-scanner-oci-off
          path: ${{ runner.temp }}/scan-image/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: CRM worker credential OpenPGP probe
on:
  pull_request:
    paths:
      - 'tools/worker-credential-probe/**'
      - '.github/workflows/crm-worker-credential-pgp-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pgp-nologin:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-admin-password
          POSTGRES_DB: crm_pgp_prototype
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_pgp_prototype"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install test clients in the disposable runner
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gnupg postgresql-client
      - name: Offline refusal and evidence guards
        run: python3 -m unittest discover -s tools/worker-credential-probe -p 'test_*.py'
      - name: Prove OpenPGP recovery and NOLOGIN with normal, error and cancellation logs
        env:
          CRM_PGP_PROTOTYPE: '1'
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 tools/worker-credential-probe/probe.py --port 5432 --container-id "$POSTGRES_CONTAINER"

name: CRM worker credential OpenPGP probe
on:
  pull_request:
    paths:
      - 'tools/worker-credential-probe/**'
      - '.github/workflows/crm-worker-credential-pgp-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pgp-nologin:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install test clients in the disposable runner
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gnupg postgresql-client
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the pinned OpenPGP operator dependency without lifecycle scripts
        run: npm ci --prefix tools/worker-credential-probe --ignore-scripts --no-audit --no-fund
      - name: Offline refusal and evidence guards
        run: |
          python3 -m unittest discover -s tools/worker-credential-probe -p 'test_*.py'
          node --test tools/worker-credential-probe/test_operator.cjs
      # Do not use Actions services: its post-job cleanup publishes Docker logs
      # outside the probe's scanner, including when a secret leak is detected.
      - name: Start an isolated PostgreSQL fixture without publishing its logs
        id: fixture
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, time
          os.umask(0o077)
          cidfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'crm-pgp-prototype.cid'
          def run(args, timeout=20):
              result = subprocess.run(args, capture_output=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError('PGP_FIXTURE_COMMAND')
              return result.stdout.decode().strip()
          try:
              if cidfile.exists():
                  raise RuntimeError('PGP_FIXTURE_EXISTS')
              cid = run(['docker', 'run', '-d', '--cidfile', str(cidfile),
                         '--label', 'com.shrigma.crm-pgp-prototype=' + os.environ['GITHUB_RUN_ID'],
                         '--publish', '127.0.0.1::5432',
                         '--env', 'POSTGRES_USER=postgres',
                         '--env', 'POSTGRES_PASSWORD=synthetic-admin-password',
                         '--env', 'POSTGRES_DB=crm_pgp_prototype',
                         '--health-cmd', 'pg_isready -U postgres -d crm_pgp_prototype',
                         '--health-interval', '2s', '--health-timeout', '2s',
                         '--health-retries', '30', 'postgres:17.10'], timeout=120)
              if not re.fullmatch(r'[a-f0-9]{64}', cid) or cidfile.read_text().strip() != cid:
                  raise RuntimeError('PGP_FIXTURE_ID')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('container_id=' + cid + '\n')
              address = run(['docker', 'port', cid, '5432/tcp'])
              match = re.fullmatch(r'127\.0\.0\.1:([0-9]{4,5})', address)
              if not match or not 1024 <= int(match[1]) <= 65535:
                  raise RuntimeError('PGP_FIXTURE_PORT')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('port=' + match[1] + '\n')
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  health = run(['docker', 'inspect', '--format', '{{.State.Health.Status}}', cid], timeout=5)
                  if health == 'healthy':
                      break
                  if health != 'starting':
                      raise RuntimeError('PGP_FIXTURE_HEALTH')
                  time.sleep(2)
              else:
                  raise RuntimeError('PGP_FIXTURE_TIMEOUT')
          except BaseException:
              raise SystemExit('PGP_FIXTURE_START_FAILED')
          PY
      - name: Prove OpenPGP recovery and NOLOGIN with normal, error and cancellation logs
        env:
          CRM_PGP_PROTOTYPE: '1'
          POSTGRES_CONTAINER: ${{ steps.fixture.outputs.container_id }}
          POSTGRES_PORT: ${{ steps.fixture.outputs.port }}
        run: python3 tools/worker-credential-probe/probe.py --port "$POSTGRES_PORT" --container-id "$POSTGRES_CONTAINER"
      - name: Remove only the fixture without printing server logs
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          cidfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'crm-pgp-prototype.cid'
          try:
              if cidfile.exists():
                  cid = cidfile.read_text().strip()
                  if not re.fullmatch(r'[a-f0-9]{64}', cid):
                      raise RuntimeError('PGP_FIXTURE_ID')
                  ownership = subprocess.run(['docker', 'inspect', '--format',
                                              '{{index .Config.Labels "com.shrigma.crm-pgp-prototype"}}', cid],
                                             capture_output=True, timeout=10)
                  if ownership.returncode or ownership.stdout.decode().strip() != os.environ['GITHUB_RUN_ID']:
                      raise RuntimeError('PGP_FIXTURE_OWNER')
                  result = subprocess.run(['docker', 'rm', '-f', cid], capture_output=True, timeout=20)
                  if result.returncode:
                      raise RuntimeError('PGP_FIXTURE_CLEANUP')
                  cidfile.unlink()
          except BaseException:
              raise SystemExit('PGP_FIXTURE_CLEANUP_FAILED')
          PY

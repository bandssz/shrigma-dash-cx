name: Restricted Home layout preview
on:
  push:
    branches: [codex/crm-home-layout6-rebase-20261022]
permissions:
  contents: read
  packages: read
jobs:
  image-and-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify source inventory and canonical compiled assets
        run: |
          node tools/crm-native-connection/verify-affiliate-read-source.cjs
          npm ci --prefix tools/campaign-runtime-build --ignore-scripts --no-audit --no-fund
          node tools/panel-build/build.cjs --panel=growth --check
      - name: Registry read session
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry_dir="$(mktemp -d "$RUNNER_TEMP/layout6-registry.XXXXXX")"
          printf 'DOCKER_CONFIG=%s\n' "$registry_dir" >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$registry_dir"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build the publication image without installation
        run: docker build --pull --platform linux/amd64 --build-arg GIT_SHA="$GITHUB_SHA" --tag shrigma-layout6:"$GITHUB_SHA" --file ops/releases/crm-native-connection-20261007/Dockerfile .
      - name: Original smoke with synthetic identity in Node22 UID1000
        run: docker run --rm --network none --read-only --user 1000:1000 --memory 512m --tmpfs /tmp:rw,nosuid,mode=1777 --tmpfs /dashboard-data:rw,noexec,nosuid,mode=0700,uid=1000,gid=1000 --mount "type=bind,src=$GITHUB_WORKSPACE/ops/releases/crm-native-connection-20261007/journey-smoke.cjs,dst=/tmp/smoke.cjs,readonly" --entrypoint node shrigma-layout6:"$GITHUB_SHA" /tmp/smoke.cjs
      - name: Drawer safety and unchanged comparison contracts in the image
        run: |
          npm install --prefix "$RUNNER_TEMP/layout6-dom" --ignore-scripts --no-audit --no-fund --package-lock=false linkedom@0.18.12
          docker run --rm --network none --read-only --user 1000:1000 --memory 512m --tmpfs /tmp:rw,nosuid,mode=1777 --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" --mount "type=bind,src=$RUNNER_TEMP/layout6-dom/node_modules,dst=/test-deps,readonly" --env NODE_PATH=/test-deps --env PAID_FACTS_RUNTIME=/app/native-backend/runtime --env DASHBOARD_ACCESS_TEST_RUNTIME=/app/native-backend/runtime --entrypoint node shrigma-layout6:"$GITHUB_SHA" --test --test-concurrency=1 /source/tests/crm-home-layout.test.cjs /source/tests/crm-paid-comparison.test.cjs /source/tests/crm-paid-facts.test.cjs /source/tests/simple-tabler-read.test.cjs
      - name: Remove registry session
        if: always()
        run: |
          if [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP"/layout6-registry.* ]]; then rm -rf -- "$DOCKER_CONFIG"; fi

name: Heartbeat 2s native PostgreSQL and Mailpit
on:
  pull_request:
    paths:
      - 'tests/heartbeat-lock-2s/**'
      - '.github/workflows/heartbeat-lock-native-proof.yml'
permissions:
  contents: read
jobs:
  native-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      fixture:
        image: postgres:17.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: listmonk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d listmonk"
          --health-interval 1s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - '127.0.0.1:51025:1025'
          - '127.0.0.1:58025:8025'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Prepare isolated Node runtime and fixture
        shell: bash
        run: |
          set -euo pipefail
          id -u 1000
          fixture_root="$(mktemp -d /tmp/shrigma-heartbeat-ci.XXXXXXXX)"
          mkdir "$fixture_root/tools" "$fixture_root/proof" "$fixture_root/source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive HEAD | tar -xf - -C "$fixture_root/source"
          sudo chown -R 1000 "$fixture_root"
          sudo chmod 755 "$fixture_root"
          printf 'HEARTBEAT_FIXTURE_ROOT=%s\n' "$fixture_root" >> "$GITHUB_ENV"
          sudo -u '#1000' env PATH="$PATH" npm install --prefix "$fixture_root/tools" --no-save --ignore-scripts --no-audit --no-fund pg@8.23.1
      - name: Check heartbeat preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTBEAT_FIXTURE_ROOT/source"
          sudo -u '#1000' env PATH="$PATH" node --test tests/heartbeat-lock-2s/preparation.test.cjs
      - name: Load official schema and dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTBEAT_FIXTURE_ROOT/source"
          sudo -u '#1000' env PATH="$PATH" NODE_PATH="$HEARTBEAT_FIXTURE_ROOT/tools/node_modules" CRM_AUDIENCE_TEST_ISOLATED=1 REGULAR_NATIVE_PROOF_ISOLATED=1 TEST_DATABASE_URL='postgresql://postgres@127.0.0.1:55432/listmonk' node tests/own-startup-recovery/bootstrap.cjs
      - name: Verify real contention and loopback SMTP
        id: native
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTBEAT_FIXTURE_ROOT/source"
          sudo -u '#1000' env PATH="$PATH" NODE_PATH="$HEARTBEAT_FIXTURE_ROOT/tools/node_modules" CRM_AUDIENCE_TEST_ISOLATED=1 HEARTBEAT_LOCK_FIXTURE_ISOLATED=1 HEARTBEAT_LOCK_FIXTURE_URL='postgresql://postgres@127.0.0.1:55432/listmonk' HEARTBEAT_LOCK_SOURCE_DIR="$HEARTBEAT_FIXTURE_ROOT/source/tests/heartbeat-lock-2s/source" HEARTBEAT_LOCK_MAILPIT_API='http://127.0.0.1:58025/' HEARTBEAT_LOCK_MAILPIT_SMTP_PORT=51025 HEARTBEAT_LOCK_FIXTURE_RECEIPT="$HEARTBEAT_FIXTURE_ROOT/proof/clients-receipt.json" node tests/heartbeat-lock-2s/native-proof.cjs | sudo -u '#1000' tee "$HEARTBEAT_FIXTURE_ROOT/proof/native.log"
      - name: Stop both isolated servers
        id: stop
        if: always()
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.fixture.id }}
          MAILPIT_CONTAINER: ${{ job.services.mailpit.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER"
          test -n "$MAILPIT_CONTAINER"
          docker inspect --format '{{.Image}}' "$PG_CONTAINER" "$MAILPIT_CONTAINER" > "$HEARTBEAT_FIXTURE_ROOT/proof/image-digests.txt"
          docker stop --time 5 "$PG_CONTAINER" "$MAILPIT_CONTAINER"
          test "$(docker inspect --format '{{.State.Running}}' "$PG_CONTAINER")" = false
          test "$(docker inspect --format '{{.State.Running}}' "$MAILPIT_CONTAINER")" = false
          test "$(docker inspect --format '{{.State.ExitCode}}' "$PG_CONTAINER")" = 0
          test "$(docker inspect --format '{{.State.ExitCode}}' "$MAILPIT_CONTAINER")" = 0
      - name: Accept after confirmed client and server end
        if: ${{ success() && steps.native.outcome == 'success' && steps.stop.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -u '#1000' env HEARTBEAT_FIXTURE_ROOT="$HEARTBEAT_FIXTURE_ROOT" python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          root=Path(os.environ['HEARTBEAT_FIXTURE_ROOT'])/'proof'
          r=json.loads((root/'clients-receipt.json').read_text())
          assert r['ok'] and r['caseCount']==9 and r['clientEndConfirmed'] and r['rollbackConfirmed']
          assert r['node']=='v22.23.3' and r['uid']==1000 and r['postgresVersion']=='17.10' and r['pgVersion']=='8.23.1'
          assert r['originalCalls']==0 and r['originalWrites']==0 and not r['operational']
          assert r['mailpitGenuine'] and r['mailpitSyntheticMessages']==1 and r['fixtureTwoClientConcurrency']
          r.update(fixtureServersEnded=True,accepted=True,imageDigests=(root/'image-digests.txt').read_text().splitlines())
          (root/'accepted.json').write_text(json.dumps(r,indent=2)+'\n')
          (root/'clients-receipt.json').chmod(0o644)
          (root/'accepted.json').chmod(0o644)
          print(json.dumps(r,separators=(',',':')))
          PYCODE
      - name: Upload only synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heartbeat-lock-2s-native-fixture
          path: ${{ env.HEARTBEAT_FIXTURE_ROOT }}/proof/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

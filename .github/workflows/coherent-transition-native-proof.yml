name: Coherent transition native fixture (SOURCE only)
on:
  pull_request:
    paths:
      - 'tools/listmonk-regular-build/coherent-transition/**'
      - 'tools/listmonk-regular-build/proof-inputs/manager-store-original.go'
      - 'n8n/growth/segment-regular-delivery.*'
      - 'n8n/growth/segment-regular-worker-lease.sql'
      - 'n8n/growth/ab-audience-regular.sql'
      - 'tests/coherent-transition/bounded-fixtures.cjs'
      - 'tests/coherent-transition/bounded-native-concurrency.test.cjs'
      - 'tests/coherent-transition/portable-source.test.cjs'
      - '.github/workflows/coherent-transition-native-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      fixture:
        image: postgres:17.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: bounded_transition_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d bounded_transition_fixture"
          --health-interval 1s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Prepare fixture tools and runtime boundary
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          id -u 1000
          fixture_root="$(mktemp -d /tmp/shrigma-coherent-ci.XXXXXXXX)"
          mkdir "$fixture_root/tools" "$fixture_root/proof" "$fixture_root/source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive HEAD | tar -xf - -C "$fixture_root/source"
          sudo chown -R 1000 "$fixture_root"
          sudo chmod 755 "$fixture_root"
          export COHERENT_FIXTURE_ROOT="$fixture_root"
          printf 'COHERENT_FIXTURE_ROOT=%s\n' "$fixture_root" >> "$GITHUB_ENV"
          sudo -u '#1000' env PATH="$PATH" npm install \
            --prefix "$COHERENT_FIXTURE_ROOT/tools" \
            --no-save --ignore-scripts --no-audit --no-fund pg@8.23.1
          sudo -u '#1000' env PATH="$PATH" node -e \
            "if(process.version!=='v22.23.3'||process.getuid()!==1000||process.platform!=='linux'||process.arch!=='x64')process.exit(1)"
      - name: Verify portable SOURCE input pins offline
        shell: bash
        run: |
          set -euo pipefail
          cd "$COHERENT_FIXTURE_ROOT/source"
          sudo -u '#1000' env PATH="$PATH" node --test tests/coherent-transition/portable-source.test.cjs
      - name: Run actual two-connection synthetic proof
        id: native
        shell: bash
        run: |
          set -euo pipefail
          cd "$COHERENT_FIXTURE_ROOT/source"
          sudo -u '#1000' env PATH="$PATH" \
            NODE_PATH="$COHERENT_FIXTURE_ROOT/tools/node_modules" \
            BOUNDED_NATIVE_FIXTURE_ISOLATED=1 \
            BOUNDED_NATIVE_FIXTURE_URL='postgresql://postgres@127.0.0.1:55432/bounded_transition_fixture' \
            BOUNDED_NATIVE_TEST_RECEIPT="$COHERENT_FIXTURE_ROOT/proof/clients-receipt.json" \
            node --test --test-reporter=tap tests/coherent-transition/bounded-native-concurrency.test.cjs \
            | sudo -u '#1000' tee "$COHERENT_FIXTURE_ROOT/proof/native-test.tap"
      - name: Stop own fixture service and confirm process end
        id: stop
        if: always()
        shell: bash
        env:
          FIXTURE_CONTAINER: ${{ job.services.fixture.id }}
        run: |
          set -euo pipefail
          test -n "$FIXTURE_CONTAINER"
          docker stop --time 5 "$FIXTURE_CONTAINER"
          test "$(docker inspect --format '{{.State.Running}}' "$FIXTURE_CONTAINER")" = false
          test "$(docker inspect --format '{{.State.ExitCode}}' "$FIXTURE_CONTAINER")" = 0
      - name: Final synthetic receipt after all gates and confirmed service stop
        if: ${{ success() && steps.native.outcome == 'success' && steps.stop.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -u '#1000' env PATH="$PATH" COHERENT_FIXTURE_ROOT="$COHERENT_FIXTURE_ROOT" python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          root=Path(os.environ['COHERENT_FIXTURE_ROOT'])/'proof'
          receipt=json.loads((root/'clients-receipt.json').read_text())
          assert receipt['scenariosPassed'] is True and receipt['clientsEnded'] is True
          assert receipt['accepted'] is False and receipt['fixtureServerEnded'] is False
          assert receipt['postgresVersion']=='17.10' and receipt['nodeVersion']=='v22.23.3'
          assert receipt['uid']==1000 and receipt['pgVersion']=='8.23.1'
          assert all(receipt[k] is False for k in ('originalPerformanceAccepted','originalAuthorityAccepted','originalOperational','originalDispatchProved'))
          receipt.update(accepted=True,fixtureServerEnded=True,status='PASSED_SYNTHETIC_NATIVE_FIXTURE_ONLY')
          target=root/'native-fixture-receipt.json'
          assert not target.exists()
          target.write_text(json.dumps(receipt,indent=2)+'\n')
          PYCODE
      - name: Upload fixture evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coherent-transition-native-fixture
          path: ${{ env.COHERENT_FIXTURE_ROOT }}/proof/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

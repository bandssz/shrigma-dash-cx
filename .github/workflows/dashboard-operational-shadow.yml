name: Dashboard operacional · sombra

'on':
  workflow_dispatch:
  push:
    branches:
      - 'codex/dashboard-operational-*'
    paths:
      - '.github/workflows/dashboard-operational-shadow.yml'
      - 'services/dashboard-operational/**'
      - 'tests/dashboard-operational-*.test.cjs'
      - 'tests/influ-cac-cliente-novo.test.cjs'
      - 'growth.html'
      - 'organico.html'
      - 'influs.html'
      - 'assets/panels/**'
      - 'logos/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/dashboard-operational-shadow.yml'
      - 'services/dashboard-operational/**'
      - 'tests/dashboard-operational-*.test.cjs'
      - 'tests/influ-cac-cliente-novo.test.cjs'
      - 'growth.html'
      - 'organico.html'
      - 'influs.html'
      - 'assets/panels/**'
      - 'logos/**'

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Testar autenticação, acesso por área, gateway e pacote
        run: node --test services/dashboard-operational/*.test.cjs tests/dashboard-operational-*.test.cjs tests/influ-cac-cliente-novo.test.cjs
      - name: Gerar pacote fechado sem segredos
        run: |
          node services/dashboard-operational/build.cjs "$RUNNER_TEMP/shrigma-build"
          node services/dashboard-operational/pack-runtime.cjs "$RUNNER_TEMP/shrigma-build" "$RUNNER_TEMP/shrigma-pack"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/shrigma-pack/source-revision.txt"
      - name: Validar build Docker fechado sem publicar
        run: |
          docker build --file services/dashboard-operational/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" --tag shrigma-dashboard-canary:ci .
      - name: Validar UID e seed único em volume Docker novo, sem rede
        run: |
          CANARY_TEST_VOLUME="shrigma-canary-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker volume rm "$CANARY_TEST_VOLUME" >/dev/null 2>&1 || true' EXIT
          docker volume create "$CANARY_TEST_VOLUME" >/dev/null
          docker run --rm --network none --cap-drop ALL --memory 512m --cpus 0.5 --volume "$CANARY_TEST_VOLUME:/dashboard-data" --entrypoint node shrigma-dashboard-canary:ci --max-old-space-size=128 -e 'const fs=require("node:fs"),start=require("/app/canary-start.cjs"); if(process.getuid()!==1000||process.getgid()!==1000)throw Error("UID mismatch"); const first=start.prepare(),file="/dashboard-data/runtime-pack.json",inode=fs.statSync(file).ino,bytes=fs.readFileSync(file); start.prepare(); if(fs.statSync(file).ino!==inode||!fs.readFileSync(file).equals(bytes)||fs.readdirSync("/dashboard-data").join()!=="runtime-pack.json")throw Error("Seed changed identity volume"); console.log("Immutable artifact verified; UID1000; seed once; no database or worker started.");'
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-operational-shadow-${{ github.sha }}
          path: ${{ runner.temp }}/shrigma-pack/
          if-no-files-found: error
          retention-days: 7

  publish-candidate-image:
    needs: validate-and-package
    if: >-
      github.event_name == 'push' &&
      github.repository == 'bandssz/shrigma-dash-cx' &&
      github.ref == 'refs/heads/codex/dashboard-operational-easypanel-20260930' &&
      contains(github.event.head_commit.message, '[publish-image]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Entrar no registry com o token efêmero do workflow
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publicar somente a imagem candidata da revisão validada
        run: |
          IMAGE="ghcr.io/bandssz/shrigma-dash-operational-canary:$GITHUB_SHA"
          docker build --file services/dashboard-operational/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" --tag "$IMAGE" .
          docker push "$IMAGE"
          printf 'Imagem candidata: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

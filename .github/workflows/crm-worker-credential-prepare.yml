name: CRM worker credential PostgreSQL
on:
  pull_request:
    paths:
      - 'tools/graph-worker-credential/**'
      - 'tools/graph-worker-access/**'
      - 'tools/graph-admin-session/**'
      - 'tools/graph-install/**'
      - 'tools/maintenance-cart-deploy/**'
      - 'n8n/growth/journey-graph-*'
      - 'tests/graph-worker-credential-*'
      - 'tests/graph-worker-access-*'
      - 'tests/journey-graph-admin-session.test.cjs'
      - 'tests/graph-admin-session-worker.test.cjs'
      - 'tests/journey-graph-*-fixture.cjs'
      - '.github/workflows/crm-worker-credential-prepare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-prepare-and-login-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the pinned OpenPGP operator dependency without lifecycle scripts
        run: npm ci --prefix tools/graph-worker-credential --ignore-scripts --no-audit --no-fund
      - name: Install pinned isolated PostgreSQL test client
        run: npm install --prefix ../graph-worker-credential-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1 @electric-sql/pglite@0.3.14
      - name: Offline preparation, finalization and operator guards
        env:
          NODE_PATH: ../graph-worker-credential-tools/node_modules
        run: node --test tests/graph-worker-credential-*.test.cjs tests/graph-worker-access-*.test.cjs tests/journey-graph-admin-session.test.cjs tests/graph-admin-session-worker.test.cjs
      # Do not use Actions services: its post-job cleanup publishes Docker logs
      # outside the probe's scanner, including when a secret leak is detected.
      - name: Start an isolated PostgreSQL fixture without publishing its logs
        id: fixture
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, time
          os.umask(0o077)
          cidfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'crm-worker-credential.cid'
          def run(args, timeout=20):
              result = subprocess.run(args, capture_output=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError('CREDENTIAL_FIXTURE_COMMAND')
              return result.stdout.decode().strip()
          try:
              if cidfile.exists():
                  raise RuntimeError('CREDENTIAL_FIXTURE_EXISTS')
              cid = run(['docker', 'run', '-d', '--cidfile', str(cidfile),
                         '--label', 'com.shrigma.crm-worker-credential=' + os.environ['GITHUB_RUN_ID'],
                         '--publish', '127.0.0.1::5432',
                         '--env', 'POSTGRES_USER=postgres',
                         '--env', 'POSTGRES_PASSWORD=synthetic-admin-password',
                         '--env', 'POSTGRES_DB=listmonk',
                         '--health-cmd', 'pg_isready -U postgres -d listmonk',
                         '--health-interval', '2s', '--health-timeout', '2s',
                         '--health-retries', '30', 'postgres:17.10'], timeout=120)
              if not re.fullmatch(r'[a-f0-9]{64}', cid) or cidfile.read_text().strip() != cid:
                  raise RuntimeError('CREDENTIAL_FIXTURE_ID')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('container_id=' + cid + '\n')
              address = run(['docker', 'port', cid, '5432/tcp'])
              match = re.fullmatch(r'127\.0\.0\.1:([0-9]{4,5})', address)
              if not match or not 1024 <= int(match[1]) <= 65535:
                  raise RuntimeError('CREDENTIAL_FIXTURE_PORT')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('port=' + match[1] + '\n')
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  health = run(['docker', 'inspect', '--format', '{{.State.Health.Status}}', cid], timeout=5)
                  if health == 'healthy':
                      break
                  if health != 'starting':
                      raise RuntimeError('CREDENTIAL_FIXTURE_HEALTH')
                  time.sleep(2)
              else:
                  raise RuntimeError('CREDENTIAL_FIXTURE_TIMEOUT')
          except BaseException:
              raise SystemExit('CREDENTIAL_FIXTURE_START_FAILED')
          PY
      - name: Prove separate preparation, explicit LOGIN and authentication on PostgreSQL 17.10
        env:
          NODE_PATH: ../graph-worker-credential-tools/node_modules
          GRAPH_WORKER_CREDENTIAL_TEST_ISOLATED: '1'
          TEST_DATABASE_URL: postgres://postgres:synthetic-admin-password@127.0.0.1:${{ steps.fixture.outputs.port }}/listmonk
          POSTGRES_CONTAINER: ${{ steps.fixture.outputs.container_id }}
        run: node tests/graph-worker-credential-postgres.cjs
      - name: Remove only the fixture without printing server logs
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          cidfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'crm-worker-credential.cid'
          try:
              if cidfile.exists():
                  cid = cidfile.read_text().strip()
                  if not re.fullmatch(r'[a-f0-9]{64}', cid):
                      raise RuntimeError('CREDENTIAL_FIXTURE_ID')
                  ownership = subprocess.run(['docker', 'inspect', '--format',
                                              '{{index .Config.Labels "com.shrigma.crm-worker-credential"}}', cid],
                                             capture_output=True, timeout=10)
                  if ownership.returncode or ownership.stdout.decode().strip() != os.environ['GITHUB_RUN_ID']:
                      raise RuntimeError('CREDENTIAL_FIXTURE_OWNER')
                  result = subprocess.run(['docker', 'rm', '-f', cid], capture_output=True, timeout=20)
                  if result.returncode:
                      raise RuntimeError('CREDENTIAL_FIXTURE_CLEANUP')
                  cidfile.unlink()
          except BaseException:
              raise SystemExit('CREDENTIAL_FIXTURE_CLEANUP_FAILED')
          PY

name: Candidate Growth maintenance retention
on:
  pull_request:
    paths:
      - 'n8n/growth/maintenance-*'
      - 'tests/maintenance-*'
      - '.github/workflows/maintenance-retention-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: maintenance_retention_test
          POSTGRES_USER: synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d maintenance_retention_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned disposable test dependencies
        run: npm install --prefix ../maintenance-test-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1 @electric-sql/pglite@0.3.14
      - name: Contract, privacy, original eligibility and deadline
        env:
          NODE_PATH: ../maintenance-test-tools/node_modules
        run: node --test tests/maintenance-retention.test.cjs tests/maintenance-adapter.test.cjs
      - name: Real independent transactions, cutoff, loss, abort and late messages
        env:
          NODE_PATH: ../maintenance-test-tools/node_modules
          TEST_DATABASE_URL: postgres://synthetic@127.0.0.1:5432/maintenance_retention_test
          MAINTENANCE_TEST_DATABASE_ISOLATED: '1'
        run: node tests/maintenance-concurrency-postgres.cjs

name: Contas · recuperação externa em sombra

'on':
  push:
    branches: ['codex/dashboard-operational-easypanel-20260930']
    paths:
      - '.github/workflows/dashboard-identity-offsite-shadow.yml'
      - 'services/dashboard-operational/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dashboard-identity-offsite-shadow.yml'
      - 'services/dashboard-operational/**'

permissions:
  contents: read

jobs:
  validate-isolated-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Testar envelope, replay, limites e transporte com fixtures
        run: node --test services/dashboard-operational/identity-envelope.test.cjs services/dashboard-operational/identity-envelope-adversarial.test.cjs services/dashboard-operational/cipher-reader.test.cjs services/dashboard-operational/mac-downloader.test.cjs services/dashboard-operational/offsite-transfer.test.cjs services/dashboard-operational/preflight-mounts.test.cjs services/dashboard-operational/preflight-mounts-adversarial.test.cjs services/dashboard-operational/jobguard.test.cjs
      - name: Construir três imagens fechadas sem publicar
        run: |
          docker build --file services/dashboard-operational/Dockerfile.offsite-snapshot --build-arg GIT_SHA="$GITHUB_SHA" --tag shrigma-identity-snapshot:ci .
          docker build --file services/dashboard-operational/Dockerfile.offsite-encrypt --build-arg GIT_SHA="$GITHUB_SHA" --tag shrigma-identity-envelope:ci .
          docker build --file services/dashboard-operational/Dockerfile.offsite-reader --build-arg GIT_SHA="$GITHUB_SHA" --tag shrigma-identity-reader:ci .
      - name: Conferir revisão, UID e conteúdo das imagens sem rede
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 128m --cpus 0.1 --entrypoint node shrigma-identity-snapshot:ci -e 'const fs=require("node:fs");if(process.getuid()!==1000||process.getgid()!==1000||fs.readdirSync("/app").sort().join()!=="backup-identity.cjs,jobguard.cjs")throw Error("Closed snapshot image mismatch");for(const p of ["/source-data","/snapshot-data"]){const s=fs.statSync(p);if(s.uid!==1000||(s.mode&511)!==448)throw Error("Mount directory mismatch");}'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 128m --cpus 0.1 --entrypoint node shrigma-identity-envelope:ci -e 'const fs=require("node:fs");if(process.getuid()!==1000||process.getgid()!==1000||fs.readdirSync("/app").sort().join()!=="backup-identity.cjs,identity-envelope.cjs")throw Error("Closed envelope image mismatch");'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 128m --cpus 0.1 --entrypoint node shrigma-identity-reader:ci -e 'const fs=require("node:fs");if(process.getuid()!==1000||process.getgid()!==1000||fs.readdirSync("/app").join()!=="cipher-reader.cjs")throw Error("Closed reader image mismatch");'
          for image in shrigma-identity-snapshot:ci shrigma-identity-envelope:ci shrigma-identity-reader:ci; do
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
          done
      - name: Executar restauração real em volumes Docker descartáveis
        env:
          OFFSITE_SNAPSHOT_IMAGE: shrigma-identity-snapshot:ci
          OFFSITE_ENCRYPT_IMAGE: shrigma-identity-envelope:ci
          OFFSITE_READER_IMAGE: shrigma-identity-reader:ci
        run: node services/dashboard-operational/ci-offsite-drill.cjs --synthetic-ci
      - name: Validar modelos Compose com valores sintéticos
        env:
          SNAPSHOT_IMAGE_REF: shrigma-identity-snapshot:ci
          ENCRYPT_IMAGE_REF: shrigma-identity-envelope:ci
          READER_IMAGE_REF: shrigma-identity-reader:ci
          CORP_IDENTITY_VOLUME: synthetic-source-only
          NEW_SNAPSHOT_VOLUME: synthetic-snapshot-only
          NEW_CIPHERTEXT_VOLUME: synthetic-cipher-only
          DASHBOARD_BACKUP_PUBLIC_KEY_PEM_B64: synthetic-public-only
          DASHBOARD_BACKUP_SNAPSHOT_NONCE_SHA256: synthetic-nonce-only
          BACKUP_READER_HOST: cipher.synthetic.invalid
          BACKUP_READER_TOKEN_SHA256: synthetic-token-only
          BACKUP_READER_EXPIRES_AT: synthetic-expiry-only
        run: |
          for file in services/dashboard-operational/compose.offsite-*.template.yml; do
            docker compose --file "$file" config --quiet
          done

  publish-reviewed-offsite-images:
    needs: validate-isolated-recovery
    if: >-
      github.event_name == 'push' &&
      github.repository == 'bandssz/shrigma-dash-cx' &&
      github.ref == 'refs/heads/codex/dashboard-operational-easypanel-20260930' &&
      contains(github.event.head_commit.message, '[publish-offsite-images]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Autenticar o registry com token efêmero da CI
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publicar somente as três imagens da revisão validada
        run: |
          docker build --file services/dashboard-operational/Dockerfile.offsite-snapshot --build-arg GIT_SHA="$GITHUB_SHA" --tag "ghcr.io/bandssz/shrigma-dash-identity-snapshot:$GITHUB_SHA" .
          docker build --file services/dashboard-operational/Dockerfile.offsite-encrypt --build-arg GIT_SHA="$GITHUB_SHA" --tag "ghcr.io/bandssz/shrigma-dash-identity-envelope:$GITHUB_SHA" .
          docker build --file services/dashboard-operational/Dockerfile.offsite-reader --build-arg GIT_SHA="$GITHUB_SHA" --tag "ghcr.io/bandssz/shrigma-dash-identity-reader:$GITHUB_SHA" .
          docker push "ghcr.io/bandssz/shrigma-dash-identity-snapshot:$GITHUB_SHA"
          docker push "ghcr.io/bandssz/shrigma-dash-identity-envelope:$GITHUB_SHA"
          docker push "ghcr.io/bandssz/shrigma-dash-identity-reader:$GITHUB_SHA"

name: Held174 own runtime handoff native proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/held174-own-runtime-handoff/**'
      - '.github/workflows/held174-own-runtime-handoff-native-proof.yml'
permissions:
  contents: read
jobs:
  postgres-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: listmonk
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d listmonk"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact public snapshot and UID 1000 runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          task_root="$RUNNER_TEMP/held174-own-runtime-handoff"
          test ! -e "$task_root"
          mkdir -m 755 "$task_root"
          mkdir -m 755 "$task_root/source" "$task_root/deps" "$task_root/evidence"
          git archive HEAD | tar -x -C "$task_root/source"
          test ! -e "$task_root/source/.git"
          test ! -e "$task_root/source/.private"
          sudo chown -R 1000:1000 "$task_root"
          docker run --rm --network host --user 1000:1000 -v "$task_root:/work" -w /work/source node:22.23.3-bookworm \
            npm install --prefix /work/deps --ignore-scripts --no-audit --no-fund --save-exact pg@8.23.1
      - name: Public original schema and constructor then 33 new PG cases
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/held174-own-runtime-handoff"
          docker run --rm --network host --user 1000:1000 \
            -v "$task_root:/work" -w /work/source \
            -e NODE_PATH=/work/deps/node_modules \
            -e CRM_AUDIENCE_TEST_ISOLATED=1 -e REGULAR_NATIVE_PROOF_ISOLATED=1 \
            -e TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55432/listmonk \
            -e HELD174_HANDOFF_FIXTURE_ISOLATED=1 \
            -e HELD174_HANDOFF_FIXTURE_URL=postgresql://postgres@127.0.0.1:55432/listmonk \
            -e HELD174_HANDOFF_FIXTURE_RECEIPT=/work/evidence/report.json \
            node:22.23.3-bookworm bash -euc '
              node --test tests/held174-own-runtime-handoff/preparation.test.cjs
              node tests/held174-own-runtime-handoff/bootstrap.cjs
              export REGULAR_NATIVE_SOURCE_PROOF=1
              node tests/held174-own-runtime-handoff/native-proof.cjs
            '
      - name: Stop the fixture and close sanitized receipt
        if: always()
        shell: bash
        env:
          FIXTURE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/held174-own-runtime-handoff"
          docker stop --time 10 "$FIXTURE_CONTAINER_ID" >/dev/null
          test "$(docker inspect --format '{{.State.Running}}' "$FIXTURE_CONTAINER_ID")" = false
          report="$task_root/evidence/report.json"
          test -f "$report"
          sudo python3 - "$report" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1]);r=json.loads(p.read_text())
          assert r['schema']=='held174-own-runtime-handoff-native-proof-v1'
          assert r['originalCalls']==0 and r['originalWrites']==0 and r['smtpCalls']==0
          assert r['synthetic'] is True and r['operational'] is False
          r['fixtureServerEnded']=True
          p.write_text(json.dumps(r,indent=2)+'\n');p.chmod(0o644)
          assert r['ok'] is True and r['caseCount']==33 and r['postgresVersion']=='17.10'
          assert r['node']=='v22.23.3' and r['uid']==1000
          assert r['rollbackConfirmed'] is True and r['clientEndConfirmed'] is True
          assert r['permanentExclusionPreserved'] is True and r['originalRuntimeMeasured'] is False
          assert r['legacyDrainEvidenceIsSyntheticOnly'] is True and r['nativeWorkerExecuted'] is False
          PY
          sudo chmod 755 "$task_root/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: held174-own-runtime-handoff-native-proof
          path: ${{ runner.temp }}/held174-own-runtime-handoff/evidence/report.json
          if-no-files-found: error

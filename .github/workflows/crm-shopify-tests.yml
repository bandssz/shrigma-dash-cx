name: CRM Shopify audience evidence (OFF)
on:
  pull_request:
    paths:
      - 'n8n/growth/segment-*'
      - 'growth-segment-*'
      - 'services/crm-shopify-sync/**'
      - 'tests/crm-shopify-sync*'
      - 'tests/segment-shopify-*'
      - 'tests/segment-audience-store-fixture.cjs'
      - 'tests/fixtures/segment-shopify-sync.cjs'
      - '.github/workflows/crm-shopify-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-selection:
    name: postgres (${{ matrix.proof }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof: customers
            script: tests/segment-shopify-postgres.cjs
          - proof: products
            script: tests/segment-shopify-products-postgres.cjs
          - proof: confirmed
            script: tests/segment-shopify-confirmed-postgres.cjs
          - proof: performance
            script: tests/segment-shopify-count-performance-postgres.cjs
          - proof: real-shape
            script: tests/segment-shopify-count-real-shape-postgres.cjs
          - proof: quarantine
            script: tests/segment-shopify-product-quarantine-postgres.cjs
          - proof: dispatch-compat
            script: tests/segment-shopify-count-dispatch-compat-postgres.cjs
          - proof: product-history-v2
            script: tests/segment-shopify-product-history-completeness-v2-postgres.cjs
          - proof: product-history-v2-real-shape
            script: tests/segment-shopify-product-history-completeness-v2-real-shape-postgres.cjs
          - proof: isolated-sync
            script: tests/crm-shopify-sync-postgres.cjs
          - proof: rfm-native-off
            script: tests/segment-shopify-rfm-native-postgres.cjs
          - proof: rfm-file-consumer-off
            script: tests/segment-shopify-rfm-producer-native-postgres.cjs
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: listmonk
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d listmonk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated test dependencies
        run: npm install --prefix ../crm-shopify-test-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1 @electric-sql/pglite@0.3.14 linkedom@0.18.12
      - name: Check collector, migration, campaign and analyst panel
        if: matrix.proof == 'customers'
        env:
          NODE_PATH: ../crm-shopify-test-tools/node_modules
          CAMPAIGN_PGLITE_MODULE: '@electric-sql/pglite'
        run: node --test --test-concurrency=2 tests/segment-shopify-*.test.cjs tests/crm-shopify-sync*.test.cjs
      - name: Build the isolated collector and prove startup OFF without credentials
        if: matrix.proof == 'isolated-sync'
        run: |
          docker build --platform linux/amd64 --file services/crm-shopify-sync/Dockerfile --tag crm-shopify-sync-synthetic:ci .
          docker run --detach --name crm-shopify-sync-ci --network none --memory 1g \
            --env "CRM_SHOPIFY_SYNC_REVISION=$GITHUB_SHA" \
            --env CRM_SHOPIFY_PRODUCER_REVISION=shopify-products-fixture-v2 \
            --env CRM_SHOPIFY_SYNC_ENABLED=false \
            --env CRM_SHOPIFY_SYNC_KEY=synthetic-ci-unused-private-key-1234 \
            --env PGHOST=postgres.invalid --env PGDATABASE=listmonk \
            --env PGUSER=crm_shopify_sync --env PGPASSWORD=synthetic-unused \
            --env CRM_SHOPIFY_FISH_SHOP=fish-fixture.myshopify.com \
            --env CRM_SHOPIFY_ARISTO_SHOP=aristo-fixture.myshopify.com \
            --env CRM_SHOPIFY_FISH_CLIENT_ID=synthetic-client-id \
            --env CRM_SHOPIFY_ARISTO_CLIENT_ID=synthetic-client-id \
            --env CRM_SHOPIFY_FISH_CLIENT_SECRET=synthetic-client-secret-unused \
            --env CRM_SHOPIFY_ARISTO_CLIENT_SECRET=synthetic-client-secret-unused \
            --env CRM_SHOPIFY_FISH_WORKFLOW_ID=fixture-fish \
            --env CRM_SHOPIFY_ARISTO_WORKFLOW_ID=fixture-aristo \
            crm-shopify-sync-synthetic:ci
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          for(let attempt=0;attempt<60;attempt++){
            const state=execFileSync('docker',['inspect','--format','{{.State.Health.Status}}','crm-shopify-sync-ci'],{encoding:'utf8'}).trim();
            if(state==='healthy')process.exit(0);
            if(state!=='starting')throw Error('Collector OFF health failed');
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)),0,0,1000);
          }
          throw Error('Collector OFF health timeout');
          NODE
          docker exec crm-shopify-sync-ci node -e "fetch('http://127.0.0.1:8080/healthz').then(async r=>{const b=await r.json();if(r.status!==200||b.enabled!==false||b.revision!==process.env.CRM_SHOPIFY_SYNC_REVISION)throw Error('OFF health mismatch')}).catch(()=>process.exit(1))"
      - name: Check role boundaries, concurrent ingestion and full-size count
        env:
          NODE_PATH: ../crm-shopify-test-tools/node_modules
          CAMPAIGN_PGLITE_MODULE: '@electric-sql/pglite'
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/listmonk
          CRM_AUDIENCE_TEST_ISOLATED: '1'
          RFM_NATIVE_TEST_ISOLATED: '1'
        run: node "${{ matrix.script }}"
      - name: Remove disposable collector container
        if: always() && matrix.proof == 'isolated-sync'
        run: docker rm -f crm-shopify-sync-ci || true

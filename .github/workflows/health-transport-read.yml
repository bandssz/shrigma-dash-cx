name: Shrigma health transport READ diagnostic
on:
  push:
    branches: [codex/health-read-night43-20261024]
permissions:
  contents: read
jobs:
  health-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Read public health by original Node and alternate transport
        run: node tools/production-release/health-transport-probe.cjs

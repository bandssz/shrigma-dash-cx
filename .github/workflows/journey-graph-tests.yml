name: Candidate journey graph
on:
  pull_request:
    paths:
      - 'n8n/growth/journey-graph-*'
      - 'growth-journey-graph-editor.js'
      - 'growth-journey-graph-editor.css'
      - 'tests/journey-graph-*'
      - 'tests/fixtures/journey-graph-runtime.cjs'
      - '.github/workflows/journey-graph-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: journey_graph_test
          POSTGRES_USER: synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d journey_graph_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated test dependencies
        run: npm install --prefix ../graph-test-tools --no-save --ignore-scripts --no-audit --no-fund pg@8.13.1 @electric-sql/pglite@0.3.14 linkedom@0.18.12
      - name: Contract and durable-state regression
        env:
          NODE_PATH: ../graph-test-tools/node_modules
        run: node --test tests/journey-graph-contract.test.cjs tests/journey-graph-runtime.test.cjs tests/journey-graph-editor.test.cjs
      - name: Independent transactions and lost commit response
        env:
          NODE_PATH: ../graph-test-tools/node_modules
          TEST_DATABASE_URL: postgres://synthetic@localhost:5432/journey_graph_test
          GRAPH_TEST_DATABASE_ISOLATED: '1'
        run: node tests/journey-graph-concurrency-postgres.cjs

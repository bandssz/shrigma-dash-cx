name: Listmonk A/B candidate artifact (OFF)
on:
  pull_request:
    paths:
      - 'tools/listmonk-ab-build/**'
      - 'n8n/growth/ab-listmonk-cohort-patch.cjs'
      - 'n8n/growth/ab-experiment-core.sql'
      - 'n8n/growth/ab-experiment-selection.sql'
      - '.github/workflows/ab-listmonk-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        target: [linux_amd64, linux_arm64]
    services:
      postgres:
        # No service for arm64: only the native amd64 worker is executed below.
        image: ${{ matrix.target == 'linux_amd64' && 'postgres:17.10' || '' }}
        env:
          POSTGRES_DB: ab_worker_smoke
          POSTGRES_USER: synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d ab_worker_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Test artifact guards, bounded SMTP capture and worker assertions
        run: python3 -m unittest discover -s tools/listmonk-ab-build -p 'test_*.py'
      - name: Build only the pinned official packaging tool
        working-directory: tools/listmonk-ab-build
        run: |
          go mod download
          go mod verify
          go build -trimpath -o "$RUNNER_TEMP/stuffbin" github.com/knadh/stuffbin/stuffbin
      - name: Produce candidate and exact upstream rollback artifact
        id: build_candidate
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: >-
          python3 tools/listmonk-ab-build/build.py
          --target "$BUILD_TARGET"
          --stuffbin "$RUNNER_TEMP/stuffbin"
          --out "$RUNNER_TEMP/listmonk-ab-$BUILD_TARGET"
      - name: Rehearse real amd64 worker with disposable DB and loopback SMTP
        if: matrix.target == 'linux_amd64'
        env:
          AB_WORKER_SMOKE_ISOLATED: '1'
        run: >-
          python3 tools/listmonk-ab-build/worker_smoke.py
          --artifact-dir "$RUNNER_TEMP/listmonk-ab-linux_amd64"
          --report "$RUNNER_TEMP/listmonk-ab-linux_amd64/worker-smoke.json"
      - name: Rehearse next-batch opt-out, process loss and guarded rollback
        if: matrix.target == 'linux_amd64'
        env:
          AB_WORKER_RECOVERY_ISOLATED: '1'
        run: >-
          python3 tools/listmonk-ab-build/worker_recovery.py
          --artifact-dir "$RUNNER_TEMP/listmonk-ab-linux_amd64"
          --report "$RUNNER_TEMP/listmonk-ab-linux_amd64/worker-recovery.json"
      - name: Compare native selection with 100k synthetic participants
        if: matrix.target == 'linux_amd64'
        env:
          AB_SELECTION_LOAD_ISOLATED: '1'
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U synthetic -d postgres -c 'CREATE DATABASE ab_selection_load;'
          python3 tools/listmonk-ab-build/selection_load.py --artifact-dir "$RUNNER_TEMP/listmonk-ab-linux_amd64" --report "$RUNNER_TEMP/listmonk-ab-linux_amd64/selection-load.json"
      - name: Upload review artifact only (no release, registry or deployment)
        if: ${{ always() && steps.build_candidate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: listmonk-6.1.0-crm-ab-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/listmonk-ab-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

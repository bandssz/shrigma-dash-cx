name: Restricted native schedule source
on:
  push:
    branches: [codex/agenda-real-20261019]
permissions:
  contents: read
jobs:
  source-image:
    if: github.repository == 'bandssz/shrigma-dash-cx'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bandssz/shrigma-dash-operational-canary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Registry session
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          agenda_registry="$(mktemp -d "$RUNNER_TEMP/agenda-registry.XXXXXX")"
          printf 'DOCKER_CONFIG=%s\n' "$agenda_registry" >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$agenda_registry"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build exact patch over installed source
        run: docker build --pull --platform linux/amd64 --build-arg GIT_SHA="$GITHUB_SHA" --tag "$IMAGE:agenda19-$GITHUB_SHA" ops/releases/agenda19/source
      - name: Prove private HTTP and body limits in actual Node22 UID1000 image
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only --user 1000:1000 --memory 768m --tmpfs /tmp:rw,nosuid,mode=1777 --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" --env CONSENT_SOURCE_TEST_RUNTIME=/app/services/crm-campaign --entrypoint node "$IMAGE:agenda19-$GITHUB_SHA" --test --test-concurrency=1 /source/tests/consent19/source-http.test.cjs /source/tests/consent19/source.test.cjs /source/tests/consent19/source-v3.test.cjs /source/tests/consent19/transport.test.cjs
      - name: Prove actual bundled adapter keeps API custody and reads1000 per page
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only --user 1000:1000 --memory 256m --entrypoint node "$IMAGE:agenda19-$GITHUB_SHA" -e 'const a=require("node:assert/strict"),{createNativeConsent}=require("/app/services/crm-campaign/consent-source.cjs");let called=0;const c=createNativeConsent({origin:"https://synthetic.invalid",username:"synthetic",token:"synthetic-token",fetchFn:async url=>{const u=new URL(url);a.equal(u.pathname,"/api/subscribers");a.equal(u.searchParams.get("per_page"),"1000");called++;return new Response(JSON.stringify({data:{results:[],total:0,page:1,per_page:1000}}),{headers:{"Content-Type":"application/json"}});}});c.api({resource:"members",id:281,page:1,perPage:1000}).then(r=>{a.equal(r.status,200);a.equal(called,1);console.log(JSON.stringify({ok:true,node:process.version,uid:process.getuid(),nativeApi16Exposed:false}));}).catch(()=>process.exitCode=1);'
      - name: Preserve source image without installing
        run: |
          docker push "$IMAGE:agenda19-$GITHUB_SHA"
          docker image inspect "$IMAGE:agenda19-$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' >> "$GITHUB_STEP_SUMMARY"

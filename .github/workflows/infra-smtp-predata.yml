name: Infrastructure SMTP pre-DATA repair candidate
on:
  push:
    branches: ['codex/infra-smtp-repair-20261015']
    paths: ['tools/infra-smtp-predata/**', '.github/workflows/infra-smtp-predata.yml']
permissions:
  contents: read
  packages: write
concurrency:
  group: infra-smtp-predata-candidate
  cancel-in-progress: false
jobs:
  reproduce-test-publish:
    if: github.ref == 'refs/heads/codex/infra-smtp-repair-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.1'
          cache: false
      - name: Reproduce installed binary, preserve Batch JIT, and test SMTP boundaries
        run: python3 tools/infra-smtp-predata/ci-build.py --out "$RUNNER_TEMP/smtp-predata" --tag "ghcr.io/bandssz/shrigma-crm-listmonk:smtp-predata-$GITHUB_SHA" --race
      - name: Authenticate only for candidate publication
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish candidate only; no production tag or service trigger
        run: |
          docker push "ghcr.io/bandssz/shrigma-crm-listmonk:smtp-predata-$GITHUB_SHA" > "$RUNNER_TEMP/smtp-predata/PUSH.txt"
          docker image inspect "ghcr.io/bandssz/shrigma-crm-listmonk:smtp-predata-$GITHUB_SHA" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/smtp-predata/REGISTRY-DIGESTS.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra-smtp-predata-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/smtp-predata/BUILD.safe.json
            ${{ runner.temp }}/smtp-predata/PUSH.txt
            ${{ runner.temp }}/smtp-predata/REGISTRY-DIGESTS.json
            ${{ runner.temp }}/smtp-predata/reconstruct-417a/*safe.json
            ${{ runner.temp }}/smtp-predata/reconstruct-417a/go-tests.synthetic.private.jsonl
            ${{ runner.temp }}/smtp-predata/reconstruct-417a/candidate-context/manifest.json
            ${{ runner.temp }}/smtp-predata/reconstruct-417a/candidate-context/source.tar.gz
            ${{ runner.temp }}/smtp-predata/reconstruct-417a/candidate-context/previous-manifest.json

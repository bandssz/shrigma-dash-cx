          SHRIGMA_EASYPANEL_DEPLOY_URL: ${{ secrets.SHRIGMA_EASYPANEL_DEPLOY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.AFFILIATE_CI_DIR+'/production-receipt.json'));fs.writeFileSync('tools/production-release/production-request.json',JSON.stringify({schema:'shrigma-production-request-v1',action:'rollback',image:r.previousEnvelopeImage}));"
          node tools/production-release/publish-ci.cjs
  rollback-production:
    if: github.repository == 'bandssz/shrigma-dash-cx' && startsWith(github.event.head_commit.message, 'rollback:')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: shrigma-gateway-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bandssz/shrigma-dash-native-connection
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Private registry session
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rollback_ci_dir="$(mktemp -d "$RUNNER_TEMP/shrigma-rollback.XXXXXX")"
          printf 'AFFILIATE_CI_DIR=%s\nDOCKER_CONFIG=%s/docker\n' "$rollback_ci_dir" "$rollback_ci_dir" >> "$GITHUB_ENV"
          mkdir -m 0700 "$rollback_ci_dir/docker"
          export DOCKER_CONFIG="$rollback_ci_dir/docker"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Retag recorded version and verify the existing gateway
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHRIGMA_EASYPANEL_DEPLOY_URL: ${{ secrets.SHRIGMA_EASYPANEL_DEPLOY_URL }}
        run: node tools/production-release/publish-ci.cjs

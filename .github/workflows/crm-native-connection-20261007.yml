name: Shrigma native CRM connection
'on':
  push:
    branches: [codex/crm-native-connection-20261007]
permissions:
  contents: read
concurrency:
  group: shrigma-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'bandssz/shrigma-dash-cx' && !startsWith(github.event.head_commit.message, 'test-only:')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bandssz/shrigma-dash-native-connection
      NODE_PATH: ${{ github.workspace }}/../growth-test-tools/node_modules
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify source composition
        run: node tools/crm-native-connection/verify-source.cjs
      - name: Verify the changed catalog-summary regression expectation
        run: node --test --test-name-pattern='catalog source summary cannot leak' tests/crm-journey-read.test.cjs
      # UI/public sources are unchanged from the accepted 8ea2fe release.
      # Only the admitted original audience COUNT integration and validator are new.
      - name: Install pinned canonical panel compiler
        run: npm ci --prefix tools/campaign-runtime-build --ignore-scripts --no-audit --no-fund
      - name: Private registry session
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          native_ci_dir="$(mktemp -d "$RUNNER_TEMP/shrigma-native.XXXXXX")"
          printf 'NATIVE_CI_DIR=%s\nDOCKER_CONFIG=%s/docker\n' "$native_ci_dir" "$native_ci_dir" >> "$GITHUB_ENV"
          mkdir -m 0700 "$native_ci_dir/docker"
          export DOCKER_CONFIG="$native_ci_dir/docker"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build explicit native backend over installed V2
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 --build-arg GIT_SHA="$GITHUB_SHA" --tag "$IMAGE:source-$GITHUB_SHA" --file ops/releases/crm-native-connection-20261007/Dockerfile .
      - name: Actual UID1000 journey assets and original authenticated READ
        shell: bash
        run: |
          set -euo pipefail
          smoke_file="$GITHUB_WORKSPACE/ops/releases/crm-native-connection-20261007/journey-smoke.cjs"
          docker run --rm --network none --read-only --memory 512m --tmpfs /tmp:rw,noexec,nosuid,mode=1777 --tmpfs /dashboard-data:rw,noexec,nosuid,mode=0700,uid=1000,gid=1000 --mount "type=bind,src=$smoke_file,dst=/tmp/native-smoke.cjs,readonly" --entrypoint node "$IMAGE:source-$GITHUB_SHA" /tmp/native-smoke.cjs > "$NATIVE_CI_DIR/smoke.json"
          node - "$NATIVE_CI_DIR/smoke.json" <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict'),r=JSON.parse(fs.readFileSync(process.argv[2],'utf8').trim().split(/\r?\n/).at(-1));a.equal(r.schema,'shrigma-configured-journey-image-smoke-v1');a.equal(r.ok,true);a.equal(r.node,'v22.23.3');a.equal(r.uid,1000);a.equal(r.actualNativeRuntimeFiles,46);a.equal(r.presentationPathsUpdated,2);for(const k of ['publicAssetsActuallyServed','originalMasterNativeRead','crossBrandDenied','nativeRevocationDenied','noEditorOrSendGrant','verifiedRuntimeAndPresentation'])a.equal(r[k],true);a.equal(r.productionIdentityUsed,false);a.equal(r.productionDatabaseUsed,false);a.equal(r.operational,false);a.equal(r.sqlInstallerEnabled,false);a.equal(r.sourceRevision,process.env.GITHUB_SHA);fs.writeFileSync(process.env.NATIVE_CI_DIR+'/receipt.json',JSON.stringify(r));console.log(JSON.stringify(r));
          NODE
      - name: Verify original Master audience COUNT inside the actual UID1000 image
        shell: bash
        run: |
          set -euo pipefail
          audience_test="$GITHUB_WORKSPACE/tests/master-audience-count/gateway.test.cjs"
          docker run --rm --network none --read-only --memory 512m --tmpfs /tmp:rw,noexec,nosuid,mode=1777 --tmpfs /dashboard-data:rw,noexec,nosuid,mode=0700,uid=1000,gid=1000 --mount "type=bind,src=$audience_test,dst=/tmp/master-audience-count-gateway.test.cjs,readonly" --env MASTER_AUDIENCE_TEST_RUNTIME=/app/native-backend/runtime --entrypoint node "$IMAGE:source-$GITHUB_SHA" --test /tmp/master-audience-count-gateway.test.cjs
      - name: Verify strict original COUNT DTO inside the actual UID1000 image
        shell: bash
        run: |
          set -euo pipefail
          audience_count_test="$GITHUB_WORKSPACE/tests/master-audience-count/count.test.cjs"
          docker run --rm --network none --read-only --memory 512m --tmpfs /tmp:rw,noexec,nosuid,mode=1777 --mount "type=bind,src=$audience_count_test,dst=/tmp/master-audience-count.test.cjs,readonly" --mount "type=bind,src=$GITHUB_WORKSPACE/n8n/growth/segment-audience-review.cjs,dst=/tmp/original-count-hash-reference.cjs,readonly" --env MASTER_AUDIENCE_HASH_REFERENCE=/tmp/original-count-hash-reference.cjs --env MASTER_AUDIENCE_TEST_RUNTIME=/app/native-backend/runtime --entrypoint node "$IMAGE:source-$GITHUB_SHA" --test /tmp/master-audience-count.test.cjs
      - name: Publish exactly the tested image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:source-$GITHUB_SHA"
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict'),{execFileSync}=require('node:child_process'),image=process.env.IMAGE+':source-'+process.env.GITHUB_SHA,info=JSON.parse(execFileSync('docker',['image','inspect',image],{encoding:'utf8'}));a.equal(info.length,1);const digest=info[0].RepoDigests.filter(s=>s.startsWith(process.env.IMAGE+'@sha256:'));a.equal(digest.length,1);const r={...JSON.parse(fs.readFileSync(process.env.NATIVE_CI_DIR+'/receipt.json')),image:digest[0],configImageId:info[0].Id,published:true,productionAdmitted:false};fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'```json\n'+JSON.stringify(r,null,2)+'\n```\n');console.log(JSON.stringify(r));
          NODE
      - name: Remove private registry session
        if: always()
        shell: bash
        run: rm -rf -- "$DOCKER_CONFIG"

  verify-test-only:
    if: github.repository == 'bandssz/shrigma-dash-cx' && startsWith(github.event.head_commit.message, 'test-only:')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NODE_PATH: ${{ github.workspace }}/../growth-test-tools/node_modules
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Prove only review expectations and custody changed since the published source
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process'),a=require('node:assert/strict');const base='8ea2fe1043bd3062a7cf62217ca5effc710f5e55',allowed=['.github/workflows/crm-native-connection-20261007.yml','tests/claude-crm-ux.test.cjs','tests/growth-segment-ui.test.cjs','tools/crm-native-connection/source-custody.json','tools/crm-native-connection/verify-source.cjs'];a.equal(execFileSync('git',['merge-base',base,'HEAD'],{encoding:'utf8'}).trim(),base);const paths=execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split('\n').sort();a.deepEqual(paths,allowed.sort());console.log(JSON.stringify({testOnly:true,publicAndRuntimeSourcesUnchanged:true,imageBuild:false,sourceBaseline:base,operational:false}));
          NODE
      - name: Verify complete source custody
        run: node tools/crm-native-connection/verify-source.cjs
      - name: Install the original local DOM test dependency
        run: npm install --prefix ../growth-test-tools --ignore-scripts --no-save --no-package-lock --no-audit --no-fund linkedom@0.18.12
      - name: Verify the four changed audience UI expectations
        run: |
          node --test --test-name-pattern='anúncio somente de leitura|both brands use named lists|archive and replacing dirty content' tests/claude-crm-ux.test.cjs tests/growth-segment-ui.test.cjs

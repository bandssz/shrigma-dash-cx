<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Sua opinião · Olivas do Campo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1efe9;color:#1c2413;font-family:Arial,sans-serif;line-height:1.6}main{max-width:580px;margin:8vh auto;padding:36px;background:white;border:1px solid #dedace;border-radius:12px}header{font:28px Georgia,serif;margin-bottom:30px}h1{font:32px Georgia,serif;line-height:1.2}p{color:#3a3a34}label{display:block;margin-bottom:8px}textarea{width:100%;min-height:130px;border:1px solid #b6b2a6;border-radius:6px;padding:12px;font:16px Arial,sans-serif}button{background:#1c2413;color:white;border:0;border-radius:6px;padding:15px 22px;font:16px Arial,sans-serif;cursor:pointer;margin-top:14px}button:disabled{opacity:.5;cursor:wait}a{color:#665409}footer{font-size:13px;margin-top:28px;border-top:1px solid #dedace;padding-top:18px}.notice{padding:14px;background:#f5f2ea;border-left:3px solid #a18511}#status{min-height:26px} [hidden]{display:none!important}@media(max-width:620px){main{margin:20px 12px;padding:26px}h1{font-size:28px}}</style></head>
<body><main><header>Olivas do Campo</header><h1 id="heading">Recebendo sua opinião…</h1><p id="status" role="status" aria-live="polite">Aguarde um instante enquanto registramos sua nota.</p><section id="feedback" hidden><p>Obrigado por nos ajudar a cuidar de cada detalhe, do olival à sua mesa.</p><form id="comment-form"><label for="comment">Quer contar o motivo da sua nota? <small>(opcional)</small></label><textarea id="comment" maxlength="4000" placeholder="Conte como foi sua experiência"></textarea><button id="submit" type="submit">Enviar comentário</button><p id="comment-status" role="status" aria-live="polite"></p></form></section><footer>Dúvidas sobre o pedido? <a href="mailto:sac@olivasdocampo.com">sac@olivasdocampo.com</a><br><a href="https://olivasdocampo.com.br/">Voltar para a Olivas do Campo</a></footer></main>
<script>
'use strict';
const params=new URLSearchParams(location.search),data={m:'olivas',p:params.get('p')||'',e:params.get('e')||'',s:params.get('s')||'',n:params.get('n')||''};
const status=document.getElementById('status'),heading=document.getElementById('heading');
async function post(path,payload){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('http');return r.json();}
async function vote(){if(params.get('m')!=='olivas'||!/^(10|[0-9])$/.test(data.n)||!data.p||!data.e||!data.s){heading.textContent='Confira seu link';status.textContent='Abra esta página pelo botão de nota do e-mail da Olivas do Campo.';return;}
try{const r=await post('/webhook/olivas-nps-vote',data);if(!r.ok)throw Error('invalid');heading.textContent=r.locked?'Sua avaliação já foi recebida':'Obrigado pela sua avaliação!';status.textContent=r.locked?'O prazo para alterar essa avaliação terminou.':'Sua nota '+data.n+' foi registrada.';document.getElementById('feedback').hidden=!!r.locked;}
catch(_){heading.textContent='Não foi possível confirmar a nota';status.textContent='Tente abrir novamente o link do e-mail. Se o problema continuar, fale com nosso atendimento.';}}
document.getElementById('comment-form').addEventListener('submit',async event=>{event.preventDefault();const comment=document.getElementById('comment').value.trim(),button=document.getElementById('submit'),message=document.getElementById('comment-status');if(!comment){message.textContent='Escreva seu comentário antes de enviar.';return;}button.disabled=true;message.textContent='Salvando…';try{const r=await post('/webhook/olivas-nps-comment',{...data,comment});if(!r.ok)throw Error('invalid');message.textContent='Comentário recebido. Obrigado!';}catch(_){message.textContent='Não foi possível confirmar o comentário. Sua nota continua salva.';}finally{button.disabled=false;}});
vote();
</script></body></html>

<style>#olivas-nps *{box-sizing:border-box}#olivas-nps{margin:0;background:#f1efe9;color:#1c2413;font-family:Arial,sans-serif;line-height:1.6}#olivas-nps{max-width:580px;margin:8vh auto;padding:36px;background:white;border:1px solid #dedace;border-radius:12px}#olivas-nps header{font:28px Georgia,serif;margin-bottom:30px}#olivas-nps h1{font:32px Georgia,serif;line-height:1.2}#olivas-nps p{color:#3a3a34}#olivas-nps label{display:block;margin-bottom:8px}#olivas-nps textarea{width:100%;min-height:130px;border:1px solid #b6b2a6;border-radius:6px;padding:12px;font:16px Arial,sans-serif}#olivas-nps button{background:#1c2413;color:white;border:0;border-radius:6px;padding:15px 22px;font:16px Arial,sans-serif;cursor:pointer;margin-top:14px}#olivas-nps button:disabled{opacity:.5;cursor:wait}#olivas-nps a{color:#665409}#olivas-nps footer{font-size:13px;margin-top:28px;border-top:1px solid #dedace;padding-top:18px}#olivas-nps .notice{padding:14px;background:#f5f2ea;border-left:3px solid #a18511}#olivas-nps #onps-status{min-height:26px}#olivas-nps [hidden]{display:none!important}@media(max-width:620px){#olivas-nps{margin:20px 12px;padding:26px}#olivas-nps h1{font-size:28px}}</style>
<section id="olivas-nps" aria-label="Avaliação Olivas do Campo"><header>Olivas do Campo</header><h1 id="onps-heading">Recebendo sua opinião…</h1><p id="onps-status" role="status" aria-live="polite">Aguarde um instante enquanto registramos sua nota.</p><section id="onps-feedback" hidden><p>Obrigado por nos ajudar a cuidar de cada detalhe, do olival à sua mesa.</p><form id="onps-comment-form"><label for="onps-comment">Quer contar o motivo da sua nota? <small>(opcional)</small></label><textarea id="onps-comment" maxlength="4000" placeholder="Conte como foi sua experiência"></textarea><button id="onps-submit" type="submit">Enviar comentário</button><p id="onps-comment-status" role="status" aria-live="polite"></p></form></section><footer>Dúvidas sobre o pedido? <a href="mailto:sac@olivasdocampo.com">sac@olivasdocampo.com</a><br><a href="https://olivasdocampo.com.br/">Voltar para a Olivas do Campo</a></footer></section>
<script>
(()=>{
'use strict';
const params=new URLSearchParams(location.search),data={m:'olivas',p:params.get('p')||'',e:params.get('e')||'',s:params.get('s')||'',n:params.get('n')||''};
const status=document.getElementById('onps-status'),heading=document.getElementById('onps-heading');
async function post(path,payload){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('http');return r.json();}
async function vote(){if(params.get('m')!=='olivas'||!/^(10|[0-9])$/.test(data.n)||!data.p||!data.e||!data.s){heading.textContent='Confira seu link';status.textContent='Abra esta página pelo botão de nota do e-mail da Olivas do Campo.';return;}
try{const r=await post('https://n8n.shrigma.com.br/webhook/olivas-nps-vote',data);if(!r.ok)throw Error('invalid');heading.textContent=r.locked?'Sua avaliação já foi recebida':'Obrigado pela sua avaliação!';status.textContent=r.locked?'O prazo para alterar essa avaliação terminou.':'Sua nota '+data.n+' foi registrada.';document.getElementById('onps-feedback').hidden=!!r.locked;}
catch(_){heading.textContent='Não foi possível confirmar a nota';status.textContent='Tente abrir novamente o link do e-mail. Se o problema continuar, fale com nosso atendimento.';}}
document.getElementById('onps-comment-form').addEventListener('submit',async event=>{event.preventDefault();const comment=document.getElementById('onps-comment').value.trim(),button=document.getElementById('onps-submit'),message=document.getElementById('onps-comment-status');if(!comment){message.textContent='Escreva seu comentário antes de enviar.';return;}button.disabled=true;message.textContent='Salvando…';try{const r=await post('https://n8n.shrigma.com.br/webhook/olivas-nps-comment',{...data,comment});if(!r.ok)throw Error('invalid');message.textContent='Comentário recebido. Obrigado!';}catch(_){message.textContent='Não foi possível confirmar o comentário. Sua nota continua salva.';}finally{button.disabled=false;}});
vote();

})();
</script>
